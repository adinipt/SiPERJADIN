<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SiPERJADIN - Sistem Perjalanan Dinas</title>
<style>
:root{
  --brand:#0d5c8c; --brand-dark:#093f60; --brand-light:#e7f2f8;
  --accent:#0e8a6d; --accent-light:#e5f6f1;
  --warn:#b5791a; --warn-light:#fbf1de;
  --danger:#b3261e; --danger-light:#fce8e6;
  --bg:#f4f6f8; --card:#ffffff; --text:#1c2530; --text-soft:#5b6b7a;
  --border:#e1e6ea; --radius:14px; --shadow:0 2px 10px rgba(20,40,60,.06);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12181f; --card:#1a2229; --text:#eaf0f5; --text-soft:#9aacba;
    --border:#2b3844; --brand-light:#173044; --accent-light:#123b31;
    --warn-light:#3a2e12; --danger-light:#3a1b18;
  }
}
:root[data-theme="dark"]{
  --bg:#12181f; --card:#1a2229; --text:#eaf0f5; --text-soft:#9aacba;
  --border:#2b3844; --brand-light:#173044; --accent-light:#123b31;
  --warn-light:#3a2e12; --danger-light:#3a1b18;
}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%;}
body{
  margin:0; height:100%; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;}
button{font-family:inherit; cursor:pointer;}
input,select,textarea{font-family:inherit; font-size:14px;}

/* ---------- App shell ---------- */
#app{display:flex; min-height:100vh;}
.sidebar{
  width:230px; flex:0 0 230px; background:linear-gradient(180deg,var(--brand-dark),var(--brand));
  color:#fff; padding:18px 0; position:sticky; top:0; height:100vh; overflow-y:auto;
  padding-top:calc(18px + env(safe-area-inset-top,0px));
}
.brand{display:flex; align-items:center; gap:10px; padding:0 18px 16px; border-bottom:1px solid rgba(255,255,255,.15); margin-bottom:10px;}
.brand-badge{width:38px; height:38px; border-radius:10px; background:rgba(255,255,255,.15); display:flex; align-items:center; justify-content:center; font-size:20px;}
.brand-name{font-weight:700; font-size:15px; line-height:1.2;}
.brand-sub{font-size:10.5px; opacity:.75; letter-spacing:.3px;}
.nav-item{
  display:flex; align-items:center; gap:10px; padding:10px 18px; font-size:13.5px;
  color:rgba(255,255,255,.82); cursor:pointer; border-left:3px solid transparent; white-space:nowrap;
}
.nav-item:hover{background:rgba(255,255,255,.08);}
.nav-item.active{background:rgba(255,255,255,.14); border-left-color:#fff; color:#fff; font-weight:600;}
.nav-icon{width:18px; text-align:center; font-size:15px;}
.nav-section-label{font-size:10px; text-transform:uppercase; letter-spacing:.6px; opacity:.55; padding:14px 18px 4px;}

.main{flex:1; min-width:0; display:flex; flex-direction:column;}
.topbar{
  position:sticky; top:0; z-index:5; background:var(--card); border-bottom:1px solid var(--border);
  padding:14px 22px; padding-top:calc(14px + env(safe-area-inset-top,0px));
  display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
}
.topbar h1{font-size:17px; margin:0;}
.topbar .sub{font-size:12px; color:var(--text-soft); margin-top:2px;}
.top-actions{display:flex; gap:8px; align-items:center;}
.menu-toggle{display:none; background:none; border:1px solid var(--border); border-radius:8px; padding:7px 10px; color:var(--text);}
.content{padding:20px 22px 60px; max-width:1280px; width:100%; margin:0 auto;}

/* ---------- Generic components ---------- */
.grid{display:grid; gap:14px;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
@media (max-width:980px){.grid-4{grid-template-columns:repeat(2,1fr);} .grid-3{grid-template-columns:repeat(2,1fr);} .grid-2{grid-template-columns:1fr;}}
@media (max-width:640px){.grid-4{grid-template-columns:1fr;}}

.card{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); padding:18px;}
.card h3{margin:0 0 4px; font-size:14px;}
.card .muted{color:var(--text-soft); font-size:12.5px;}

.stat-card{display:flex; flex-direction:column; gap:6px;}
.stat-top{display:flex; justify-content:space-between; align-items:flex-start;}
.stat-icon{width:36px; height:36px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:17px;}
.stat-val{font-size:24px; font-weight:700;}
.stat-label{font-size:12.5px; color:var(--text-soft);}
.stat-trend{font-size:11.5px; font-weight:600; padding:2px 7px; border-radius:20px;}

.section-title{display:flex; align-items:center; justify-content:space-between; margin:26px 0 12px;}
.section-title h2{font-size:15.5px; margin:0;}
.section-title .hint{font-size:12px; color:var(--text-soft);}

.btn{border:none; border-radius:9px; padding:9px 15px; font-size:13px; font-weight:600; display:inline-flex; align-items:center; gap:6px; transition:filter .15s;}
.btn:hover{filter:brightness(1.06);}
.btn:active{filter:brightness(.94);}
.btn-primary{background:var(--brand); color:#fff;}
.btn-accent{background:var(--accent); color:#fff;}
.btn-outline{background:transparent; border:1px solid var(--border); color:var(--text);}
.btn-danger{background:var(--danger); color:#fff;}
.btn-warn{background:var(--warn); color:#fff;}
.btn-sm{padding:6px 10px; font-size:12px; border-radius:7px;}
.btn[disabled]{opacity:.45; cursor:not-allowed;}

.badge{display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:700; padding:3px 9px; border-radius:20px; white-space:nowrap;}
.b-draft{background:#eceff1; color:#546069;}
.b-diajukan{background:var(--warn-light); color:var(--warn);}
.b-atasan{background:#e6ecfb; color:#3453b3;}
.b-ppk{background:#eee3fb; color:#6d33b3;}
.b-terbit{background:var(--brand-light); color:var(--brand);}
.b-berjalan{background:#e0f3fb; color:#0c7fb0;}
.b-selesai{background:var(--accent-light); color:var(--accent);}
.b-lpj{background:#fff1da; color:#a5680b;}
.b-tutup{background:#e4f7ec; color:#1b8a52;}
.b-tolak{background:var(--danger-light); color:var(--danger);}

table{width:100%; border-collapse:collapse; font-size:13px;}
th{text-align:left; font-size:11.5px; text-transform:uppercase; letter-spacing:.3px; color:var(--text-soft); padding:9px 10px; border-bottom:1px solid var(--border); white-space:nowrap;}
td{padding:10px 10px; border-bottom:1px solid var(--border); vertical-align:top;}
tr:last-child td{border-bottom:none;}
.table-wrap{overflow-x:auto; border-radius:12px; border:1px solid var(--border);}
.table-wrap table{min-width:640px;}
.table-wrap.tight table{min-width:0;}

.form-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px 16px;}
@media (max-width:700px){.form-grid{grid-template-columns:1fr;}}
.form-grid .full{grid-column:1/-1;}
label{display:block; font-size:12.5px; font-weight:600; margin-bottom:5px; color:var(--text-soft);}
input[type=text],input[type=number],input[type=date],select,textarea{
  width:100%; padding:9px 11px; border:1px solid var(--border); border-radius:9px; background:var(--bg); color:var(--text);
}
textarea{resize:vertical; min-height:64px;}
.checkline{display:flex; align-items:center; gap:8px; padding:8px 10px; border:1px solid var(--border); border-radius:9px; margin-bottom:6px; font-size:13px; background:var(--bg);}
.checkline input{width:auto;}

.modal-bg{position:fixed; inset:0; background:rgba(10,18,26,.55); display:none; align-items:flex-start; justify-content:center; z-index:50; padding:26px 14px; overflow-y:auto;}
.modal-bg.open{display:flex;}
.modal{background:var(--card); border-radius:16px; width:100%; max-width:760px; padding:22px; box-shadow:0 20px 60px rgba(0,0,0,.3); margin-bottom:40px;}
.modal.wide{max-width:920px;}
.modal-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;}
.modal-head h3{margin:0; font-size:16px;}
.close-x{background:none; border:none; font-size:20px; color:var(--text-soft); padding:2px 6px;}

.pill-tabs{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:16px;}
.pill{padding:7px 13px; border-radius:20px; font-size:12.5px; font-weight:600; border:1px solid var(--border); background:var(--card); color:var(--text-soft);}
.pill.active{background:var(--brand); color:#fff; border-color:var(--brand);}

.alert{border-radius:10px; padding:11px 14px; font-size:12.8px; display:flex; gap:9px; align-items:flex-start; margin-bottom:14px;}
.alert-info{background:var(--brand-light); color:var(--brand-dark);}
.alert-warn{background:var(--warn-light); color:var(--warn);}
.alert-danger{background:var(--danger-light); color:var(--danger);}
.alert-ok{background:var(--accent-light); color:var(--accent);}

.timeline{list-style:none; margin:0; padding:0;}
.timeline li{display:flex; gap:12px; padding:9px 0; border-bottom:1px dashed var(--border);}
.timeline li:last-child{border-bottom:none;}
.tl-dot{width:9px; height:9px; border-radius:50%; background:var(--brand); margin-top:5px; flex:0 0 9px;}
.tl-dot.dim{background:var(--border);}
.tl-body b{font-size:12.8px;}
.tl-body .when{font-size:11.3px; color:var(--text-soft);}

.bar-chart{display:flex; align-items:flex-end; gap:10px; height:150px; padding:6px 4px;}
.bar-col{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; gap:6px;}
.bar-fill{width:100%; max-width:34px; border-radius:6px 6px 2px 2px; background:linear-gradient(180deg,var(--brand),var(--brand-dark)); min-height:3px;}
.bar-label{font-size:10.5px; color:var(--text-soft);}
.bar-val{font-size:10px; color:var(--text-soft); font-weight:700;}

.donut-wrap{display:flex; align-items:center; gap:18px; flex-wrap:wrap;}
.donut{width:120px; height:120px; border-radius:50%; flex:0 0 120px;}
.legend{display:flex; flex-direction:column; gap:6px; font-size:12px;}
.legend-item{display:flex; align-items:center; gap:7px;}
.dot{width:9px; height:9px; border-radius:50%;}

.empty{text-align:center; padding:34px 10px; color:var(--text-soft); font-size:13px;}
.icon-btn{background:var(--bg); border:1px solid var(--border); border-radius:8px; width:30px; height:30px; display:inline-flex; align-items:center; justify-content:center; font-size:13px; color:var(--text);}
.actions-row{display:flex; gap:6px; flex-wrap:wrap;}
.search-box{display:flex; align-items:center; gap:8px; background:var(--bg); border:1px solid var(--border); border-radius:9px; padding:8px 12px; flex:1; min-width:180px;}
.search-box input{border:none; background:transparent; padding:0; flex:1;}
.toolbar{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:14px;}

.doc-sheet{background:#fff; color:#111; border-radius:6px; padding:34px 38px; font-size:12.6px; line-height:1.55; border:1px solid var(--border); max-width:760px; margin:0 auto;}
.doc-sheet h2{text-align:center; font-size:14px; margin:2px 0; text-decoration:underline;}
.doc-sheet .doc-sub{text-align:center; font-size:11.5px; margin-bottom:14px;}
.doc-table{width:100%; border-collapse:collapse; margin:10px 0;}
.doc-table td,.doc-table th{border:1px solid #444; padding:6px 8px; font-size:11.8px; vertical-align:top;}
.doc-num-col{width:26px; text-align:center;}
.sig-block{display:flex; justify-content:flex-end; margin-top:26px;}
.sig-inner{text-align:center; font-size:12px; width:230px;}
.sig-inner .space{height:60px;}

.calendar-toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--card);}
.cal-head{padding:9px 7px;background:var(--bg);font-size:11px;font-weight:700;color:var(--text-soft);text-align:center;border-right:1px solid var(--border);border-bottom:1px solid var(--border);}
.cal-day{min-height:125px;padding:7px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);background:var(--card);}
.cal-day.muted{background:var(--bg);opacity:.65;}
.cal-day.today{box-shadow:inset 0 0 0 2px var(--brand);}
.cal-num{font-weight:700;font-size:12px;margin-bottom:5px;}
.cal-event{display:block;padding:5px 6px;border-radius:7px;margin:4px 0;font-size:10.5px;line-height:1.25;cursor:pointer;border-left:3px solid;}
.cal-plan{background:var(--warn-light);border-left-color:var(--warn);color:var(--warn);}
.cal-live{background:var(--brand-light);border-left-color:var(--brand);color:var(--brand);}
.cal-done{background:var(--accent-light);border-left-color:var(--accent);color:var(--accent);}
.cal-manual{background:#eee3fb;border-left-color:#6d33b3;color:#6d33b3;}
.calendar-legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--text-soft);}
.import-box{border:1px dashed var(--border);padding:14px;border-radius:12px;background:var(--bg);}

@media print{
  body *{visibility:hidden;}
  #printArea, #printArea *{visibility:visible;}
  #printArea{position:absolute; top:0; left:0; width:100%;}
  .no-print{display:none !important;}
}

.toast-wrap{position:fixed; bottom:calc(18px + env(safe-area-inset-bottom,0px)); right:18px; display:flex; flex-direction:column; gap:8px; z-index:80;}
.toast{background:var(--brand-dark); color:#fff; padding:10px 16px; border-radius:9px; font-size:12.8px; box-shadow:0 8px 20px rgba(0,0,0,.25); animation:fadein .2s ease;}
@keyframes fadein{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

.law-card{border-left:4px solid var(--brand); padding:12px 14px; background:var(--bg); border-radius:0 10px 10px 0; margin-bottom:12px;}
.law-card b{font-size:13px;}
.law-card p{margin:5px 0 0; font-size:12.6px; color:var(--text-soft);}

.progress-bar{height:9px; border-radius:6px; background:var(--border); overflow:hidden;}
.progress-fill{height:100%; border-radius:6px; background:var(--accent);}

@media (max-width:900px){
  .sidebar{position:fixed; left:0; top:0; bottom:0; z-index:40; transform:translateX(-100%); transition:transform .2s ease; box-shadow:0 0 30px rgba(0,0,0,.3);}
  .sidebar.open{transform:translateX(0);}
  .menu-toggle{display:inline-flex;}
  .sidebar-backdrop{display:none; position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:35;}
  .sidebar-backdrop.open{display:block;}
}
.cal-actions{display:inline-flex;gap:2px;margin-left:3px;vertical-align:middle}.cal-actions button{border:0;background:transparent;padding:0;cursor:pointer;font-size:11px;line-height:1}.cal-event{display:flex;align-items:center;justify-content:space-between;gap:3px}.cal-event>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* Import daftar hadir */
.import-progress{position:fixed;inset:0;background:rgba(10,25,40,.42);display:flex;align-items:center;justify-content:center;z-index:9999;padding:20px;}
.import-progress-card{width:min(460px,100%);background:var(--card);border:1px solid var(--border);border-radius:16px;padding:22px;box-shadow:0 12px 40px rgba(0,0,0,.2);text-align:center;}
.import-spinner{width:42px;height:42px;border:4px solid var(--border);border-top-color:var(--brand);border-radius:50%;animation:importSpin .8s linear infinite;margin:0 auto 14px;}
@keyframes importSpin{to{transform:rotate(360deg)}}
.import-progress-title{font-weight:700;font-size:15px;margin-bottom:6px;}
.import-progress-text{font-size:12.5px;color:var(--text-soft);line-height:1.5;}
.import-progress-bar{height:8px;background:var(--border);border-radius:99px;overflow:hidden;margin-top:14px;}
.import-progress-fill{height:100%;width:0;background:var(--brand);transition:width .15s ease;}

/* Bulk selection & deletion */
.bulk-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 10px;padding:9px 11px;border:1px solid var(--border);border-radius:10px;background:var(--bg);}
.bulk-tools .bulk-count{font-size:12px;color:var(--text-soft);margin-right:auto;}
.row-check{width:16px;height:16px;accent-color:var(--brand);}
.select-cell{width:34px;text-align:center;}
.row-check{appearance:auto!important;-webkit-appearance:checkbox!important;width:18px!important;height:18px!important;display:inline-block!important;vertical-align:middle;cursor:pointer;accent-color:var(--brand);margin:0;}
.bulk-tools .select-all-label{font-size:12px;font-weight:700;color:var(--text);display:inline-flex;align-items:center;gap:6px;cursor:pointer;}
.import-summary{margin-top:10px;padding:10px 12px;border-radius:9px;background:var(--accent-light);color:var(--accent);font-size:12.5px;display:none;}
</style>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js" defer></script>
</head>
<body>
<div id="app">
  <div class="sidebar-backdrop no-print" id="sbBackdrop" onclick="toggleSidebar(false)"></div>
  <nav class="sidebar no-print" id="sidebar">
    <div class="brand">
      <div class="brand-badge">🧭</div>
      <div>
        <div class="brand-name">SiPERJADIN</div>
        <div class="brand-sub">Sistem Perjalanan Dinas</div>
      </div>
    </div>
    <div class="nav-section-label">Menu Utama</div>
    <div class="nav-item" data-view="dashboard"><span class="nav-icon">📊</span> Dashboard</div>
    <div class="nav-item" data-view="perencanaan"><span class="nav-icon">🗓️</span> Perencanaan Perjadin</div>
    <div class="nav-item" data-view="kalender"><span class="nav-icon">📅</span> Kalender Perjadin</div>
    <div class="nav-item" data-view="pengajuan"><span class="nav-icon">📝</span> Pengajuan SPPD</div>
    <div class="nav-item" data-view="approval"><span class="nav-icon">✅</span> Persetujuan</div>
    <div class="nav-item" data-view="dokumen"><span class="nav-icon">📄</span> Dokumen &amp; Cetak</div>
    <div class="nav-item" data-view="lpj"><span class="nav-icon">📥</span> Laporan &amp; LPJ</div>
    <div class="nav-section-label">Kelola</div>
    <div class="nav-item" data-view="anggaran"><span class="nav-icon">💰</span> Anggaran</div>
    <div class="nav-item" data-view="master"><span class="nav-icon">🗂️</span> Master Data &amp; Tarif</div>
    <div class="nav-item" data-view="hukum"><span class="nav-icon">⚖️</span> Dasar Hukum</div>
  </nav>

  <div class="main">
    <div class="topbar no-print">
      <div style="display:flex; align-items:center; gap:10px;">
        <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
        <div>
          <h1 id="viewTitle">Dashboard</h1>
          <div class="sub" id="viewSub">Ringkasan perjalanan dinas &amp; anggaran</div>
        </div>
      </div>
      <div class="top-actions">
        <button class="btn btn-outline btn-sm" onclick="toggleTheme()">🌓 Tema</button>
        <button class="btn btn-primary btn-sm" onclick="openSppdModal()">+ SPPD Baru</button>
      </div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<div class="modal-bg no-print" id="modalBg"><div class="modal" id="modalBox"></div></div>
<div class="toast-wrap no-print" id="toastWrap"></div>
<div id="printArea" style="display:none;"></div>

<script>
/* =========================================================
   SiPERJADIN — data layer
========================================================= */
const STORE_KEY = 'siperjadin_v7_clean';
// Mulai dari penyimpanan baru agar tidak ada data demo/progres dari versi sebelumnya.
try{ ['siperjadin_v1','siperjadin_v2','siperjadin_v3','siperjadin_v4','siperjadin_v5','siperjadin_v6_clean'].forEach(k=>localStorage.removeItem(k)); }catch(e){}
const todayISO = () => new Date().toISOString().slice(0,10);
const fmtRp = n => 'Rp' + Math.round(n||0).toLocaleString('id-ID');
const fmtDate = d => d ? new Date(d+'T00:00:00').toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'}) : '-';
const daysBetween = (a,b) => Math.round((new Date(b) - new Date(a))/86400000) + 1;
const uid = p => p + '-' + Math.random().toString(36).slice(2,8);

function seedData(){
  return {
    settings:{ tahunAnggaran:new Date().getFullYear(), batasLPJHari:5, namaInstansi:'', kotaInstansi:'', kalenderMode:'otomatis' },
    // Semua data pribadi/SPPD/progres sengaja dimulai KOSONG. Data hanya muncul setelah pengguna memasukkannya.
    pegawai:[],
    unitKerja:[],
    zona:[
      {id:'z1', nama:'Zona 1 (mis. Aceh, Sumut, Kalimantan)', harian:360000},
      {id:'z2', nama:'Zona 2 (mis. Sumatera lain, Jawa, Bali)', harian:430000},
      {id:'z3', nama:'Zona 3 (mis. NTB, NTT, Sulawesi)', harian:480000},
      {id:'z4', nama:'Zona 4 (mis. Maluku, sebagian Kalimantan)', harian:530000},
      {id:'z5', nama:'Zona 5 (Papua & sekitarnya)', harian:580000}
    ],
    dalamKota:{ umum:230000, diklat:170000 },
    representasi:{ 'Eselon I':130000, 'Eselon II':65000, 'Eselon III/IV':0, 'Fungsional/Staf':0 },

    },
    transportLokal:196000,
    sppd:[], lpj:[], kalenderManual:[], kehadiran:[], seq:1
  };
}

function normalizeData(d){
  d = d || {};
  d.settings = Object.assign({tahunAnggaran:new Date().getFullYear(), batasLPJHari:5, namaInstansi:'', kotaInstansi:'', kalenderMode:'otomatis'}, d.settings||{});
  d.pegawai = Array.isArray(d.pegawai)?d.pegawai:[];
  d.unitKerja = Array.isArray(d.unitKerja)?d.unitKerja:[];
  d.sppd = Array.isArray(d.sppd)?d.sppd:[];
  d.lpj = Array.isArray(d.lpj)?d.lpj:[];
  d.kalenderManual = Array.isArray(d.kalenderManual)?d.kalenderManual:[];
  d.kehadiran = Array.isArray(d.kehadiran)?d.kehadiran:[];
  return d;
}
function loadData(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw){ return normalizeData(JSON.parse(raw)); }
  }catch(e){ console.warn('storage read failed', e); }
  const fresh = normalizeData(seedData());
  saveData(fresh);
  return fresh;
}

function saveData(d){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(d)); }
  catch(e){ console.warn('storage write failed', e); }
}

function autoAdvanceByDate(d){
  if(!d || !Array.isArray(d.sppd)) return;
  const t=todayISO();
  d.sppd.forEach(s=>{
    if(!s || !s.status) return;
    if(s.status==='SPPD Terbit' && s.tanggalBerangkat && s.tanggalKembali && s.tanggalBerangkat<=t && s.tanggalKembali>=t) s.status='Sedang Berjalan';
    else if(s.status==='Sedang Berjalan' && s.tanggalKembali && s.tanggalKembali<t) s.status='Selesai';
  });
}

function navigate(view){
  currentView = view;
  autoAdvanceByDate(DB); saveData(DB);
  document.querySelectorAll('.nav-item').forEach(el=>el.classList.toggle('active', el.dataset.view===view));
  document.getElementById('viewTitle').textContent = VIEWS[view].title;
  document.getElementById('viewSub').textContent = VIEWS[view].sub;
  document.getElementById('content').innerHTML = '';
  VIEWS[view].render();
  toggleSidebar(false);
  window.scrollTo({top:0});
}

}

}

let calendarCursor = new Date();
function renderKalender(){
  const c=document.getElementById('content');
  const y=calendarCursor.getFullYear(), m=calendarCursor.getMonth();
  const map=calendarDateMap(y,m);
  const first=new Date(y,m,1), last=new Date(y,m+1,0);
  const start=first.getDay();
  const total=Math.ceil((start+last.getDate())/7)*7;
  const names=['Min','Sen','Sel','Rab','Kam','Jum','Sab'];
  let cells='';
  for(let i=0;i<total;i++){
    const day=i-start+1;
    const inMonth=day>=1&&day<=last.getDate();
    const d=inMonth?new Date(y,m,day):new Date(y,m,day);
    const iso=d.toISOString().slice(0,10);
    const items=inMonth?(map[iso]||[]):[];
    const isToday=iso===todayISO();
    cells+=`<div class="cal-day ${inMonth?'':'muted'} ${isToday?'today':''}" ondblclick="${inMonth?`openCalendarDay('${iso}')`:''}">
      <div class="cal-num">${inMonth?day:''}</div>
      ${items.slice(0,5).map(s=>{
        if(s.isManualEvent) return `<div class="cal-event cal-manual" title="Agenda manual"><span onclick="viewManualCalendar('${s.id}')">📝 ${s.judul}</span><span class="cal-actions"><button onclick="event.stopPropagation();viewManualCalendar('${s.id}')">👁️</button><button onclick="event.stopPropagation();openManualCalendarModal('${s.id}')">✏️</button><button onclick="event.stopPropagation();deleteManualCalendar('${s.id}')">🗑️</button></span></div>`;
        const st=calendarStatus(s);
        return `<div class="cal-event ${calendarStatusClass(st)}" title="Perjalanan"><span onclick="viewSppd('${s.id}')">${calendarStatusIcon(st)} ${s.kotaTujuan} · ${pegawaiNames(s)}</span><span class="cal-actions"><button onclick="event.stopPropagation();viewSppd('${s.id}')">👁️</button><button onclick="event.stopPropagation();openSppdModal('${s.id}')">✏️</button><button onclick="event.stopPropagation();deleteSppdAndRefresh('${s.id}','kalender')">🗑️</button></span></div>`;
      }).join('')}
      ${items.length>5?`<div class="muted" style="font-size:10px;">+${items.length-5} lainnya</div>`:''}
    </div>`;
  }
  c.innerHTML=`
    <div class="card">
      <div class="calendar-toolbar">
        <div class="actions-row">
          <button class="btn btn-outline btn-sm" onclick="calendarMove(-1)">← Bulan Sebelumnya</button>
          <button class="btn btn-outline btn-sm" onclick="calendarCursor=new Date();renderKalender()">Hari Ini</button>
          <button class="btn btn-outline btn-sm" onclick="calendarMove(1)">Bulan Berikutnya →</button>
        </div>
        <div style="font-size:18px;font-weight:700;">${new Date(y,m,1).toLocaleDateString('id-ID',{month:'long',year:'numeric'})}</div>
        <div class="actions-row"><button class="btn btn-primary btn-sm" onclick="openManualCalendarModal()">+ Agenda Manual</button><button class="btn btn-outline btn-sm" onclick="bulkCalendarManager()">🗑️ Kelola/Hapus Banyak</button></div>
      </div>
      <div class="calendar-legend">
        <span>🟡 Perencanaan</span><span>🔵 Sedang Berlangsung</span><span>🟢 Selesai</span><span>📝 Agenda Manual</span>
      </div>
      <div class="alert alert-info" style="margin-top:12px;">Status kalender otomatis mengikuti tanggal keberangkatan dan tanggal kembali. Setiap perjalanan tetap bisa diedit manual melalui ikon/agenda pada kalender.</div>
      <div class="calendar-grid">
        ${names.map(n=>`<div class="cal-head">${n}</div>`).join('')}
        ${cells}
      </div>
      <div class="section-title" style="margin-top:18px;"><h2>Daftar Data pada Bulan Ini</h2><span class="hint">Centang per baris untuk hapus sekaligus</span></div>
      ${bulkToolbar('sppd','SPPD bulan ini')}
      <div class="table-wrap"><table><thead><tr><th class="select-cell">✓</th><th>Tanggal</th><th>SPPD</th><th>Tujuan</th><th>Status</th><th>Aksi</th></tr></thead><tbody>
        ${DB.sppd.filter(x=>String(x.tanggalBerangkat).slice(0,7)===`${y}-${String(m+1).padStart(2,'0')}`).map(x=>`<tr><td class="select-cell"><input class="row-check bulk-check" data-bulk-type="sppd" value="${esc(x.id)}" onchange="updateBulkCount('sppd')"></td><td>${fmtDate(x.tanggalBerangkat)}</td><td>${esc(x.nomor)}</td><td>${esc(x.kotaTujuan)}</td><td>${esc(x.status)}</td><td><button class="icon-btn" title="Lihat" onclick="viewSppd('${x.id}')">👁️</button><button class="icon-btn" title="Edit" onclick="openSppdModal('${x.id}')">✏️</button><button class="icon-btn" title="Hapus" onclick="deleteSppdAndRefresh('${x.id}','kalender')">🗑️</button></td></tr>`).join('')||'<tr><td colspan="6"><div class="empty">Tidak ada SPPD pada bulan ini.</div></td></tr>'}</tbody></table></div>
      ${bulkToolbar('cal','agenda manual')}
      <div class="table-wrap"><table><thead><tr><th class="select-cell">✓</th><th>Tanggal</th><th>Judul</th><th>Status</th><th>Aksi</th></tr></thead><tbody>
        ${(DB.kalenderManual||[]).filter(x=>String(x.tanggal).slice(0,7)===`${y}-${String(m+1).padStart(2,'0')}`).map(x=>`<tr><td class="select-cell"><input class="row-check bulk-check" data-bulk-type="cal" value="${esc(x.id)}" onchange="updateBulkCount('cal')"></td><td>${fmtDate(x.tanggal)}</td><td>${esc(x.judul)}</td><td>${esc(x.status||'-')}</td><td><button class="icon-btn" title="Lihat" onclick="viewManualCalendar('${x.id}')">👁️</button><button class="icon-btn" title="Edit" onclick="openManualCalendarModal('${x.id}')">✏️</button><button class="icon-btn" title="Hapus" onclick="deleteManualCalendar('${x.id}')">🗑️</button></td></tr>`).join('')||'<tr><td colspan="5"><div class="empty">Tidak ada agenda manual pada bulan ini.</div></td></tr>'}</tbody></table></div>
    </div>
  `;
}

function saveManualCalendar(id){
  const data={tanggal:document.getElementById('cal_tgl').value,judul:document.getElementById('cal_judul').value.trim(),keterangan:document.getElementById('cal_ket').value.trim(),status:document.getElementById('cal_st').value};
  if(!data.tanggal||!data.judul){toast('Tanggal dan judul wajib diisi');return;}
  if(id) Object.assign(DB.kalenderManual.find(x=>x.id===id),data);
  else DB.kalenderManual.push(Object.assign({id:uid('cal')},data));
  saveData(DB); closeModal(); renderKalender(); toast('Agenda kalender disimpan');
}
function deleteManualCalendar(id){
  if(!confirm('Hapus agenda manual ini?')) return;
  DB.kalenderManual=DB.kalenderManual.filter(x=>x.id!==id);
  saveData(DB); closeModal(); renderKalender(); toast('Agenda dihapus');
}
function viewManualCalendar(id){ const e=DB.kalenderManual.find(x=>x.id===id); if(!e)return; simpleView('Lihat Agenda Kalender',`<b>Tanggal:</b> ${fmtDate(e.tanggal)}<br><b>Judul:</b> ${esc(e.judul)}<br><b>Status:</b> ${esc(e.status||'-')}<br><b>Keterangan:</b><br>${esc(e.keterangan||'-')}`); }
function deleteSppdAndRefresh(id,target){ if(!confirm('Hapus data SPPD ini? Data LPJ terkait juga akan dihapus.')) return; DB.sppd=DB.sppd.filter(s=>s.id!==id); DB.lpj=DB.lpj.filter(l=>l.sppdId!==id); saveData(DB); if(target==='perencanaan') renderPerencanaan(); else if(target==='approval') renderApproval(); else if(target==='lpj') renderLpj(); else if(target==='kalender') renderKalender(); else if(VIEWS[currentView]) VIEWS[currentView].render(); toast('SPPD dihapus'); }
function deleteUnitFromAnggaran(id){ deleteUnit(id); if(VIEWS[currentView]) VIEWS[currentView].render(); }

function renderPengajuan(){
  const c = document.getElementById('content');
  c.innerHTML = `
    <div class="toolbar">
      <div class="search-box">🔍 <input id="searchSppd" placeholder="Cari nomor SPPD, tujuan, atau pegawai..." oninput="filterSppdTable()"></div>
      <select id="filterStatus" onchange="filterSppdTable()">
        <option value="">Semua Status</option>
        ${STATUS_FLOW.concat(['Draft','Ditolak']).map(s=>`<option value="${s}">${s}</option>`).join('')}
      </select>
      <button class="btn btn-primary" onclick="openSppdModal()">+ SPPD Baru</button>
    </div>
    ${bulkToolbar('sppd','SPPD')}
    <div class="table-wrap"><table id="sppdTable">
      <thead><tr><th class="select-cell">✓</th><th>Nomor SPPD</th><th>Pegawai</th><th>Tujuan</th><th>Periode</th><th>Biaya</th><th>Status</th><th></th></tr></thead>
      <tbody id="sppdTbody"></tbody>
    </table></div>
  `;
  filterSppdTable();
}
function filterSppdTable(){
  const q = (document.getElementById('searchSppd')?.value||'').toLowerCase();
  const st = document.getElementById('filterStatus')?.value||'';
  const rows = DB.sppd
    .filter(s=> (!st || s.status===st))
    .filter(s=> !q || s.nomor.toLowerCase().includes(q) || s.kotaTujuan.toLowerCase().includes(q) || pegawaiNames(s).toLowerCase().includes(q))
    .sort((a,b)=> b.tanggalBerangkat.localeCompare(a.tanggalBerangkat));
  document.getElementById('sppdTbody').innerHTML = rows.map(s=>`
    <tr>
      <td class="select-cell"><input class="row-check bulk-check" data-bulk-type="sppd" value="${esc(s.id)}" onchange="updateBulkCount('sppd')"></td><td><b>${esc(s.nomor)}</b><br><span class="muted">${s.maksud}</span></td>
      <td>${pegawaiNames(s)}</td>
      <td>${s.kotaTujuan}${s.statusDalamKota?' (dalam kota)':''}</td>
      <td>${fmtDate(s.tanggalBerangkat)}<br>s.d. ${fmtDate(s.tanggalKembali)}</td>
      <td>${fmtRp(s.totalBiaya)}</td>
      <td><span class="badge ${statusBadgeClass(s.status)}">${s.status}</span></td>
      <td><div class="actions-row">
        <button class="icon-btn" title="Lihat" onclick="viewSppd('${s.id}')">👁️</button><button class="icon-btn" title="Edit" onclick="openSppdModal('${s.id}')">✏️</button>
        <button class="icon-btn" title="Cetak Dokumen" onclick="navigate('dokumen'); setTimeout(()=>selectDokumen('${s.id}'),50)">📄</button>
        <button class="icon-btn" title="Hapus" onclick="deleteSppd('${s.id}')">🗑️</button>
      </div></td>
    </tr>
  `).join('') || `<tr><td colspan="8"><div class="empty">Tidak ada data SPPD yang cocok.</div></td></tr>`;
}
function deleteSppd(id){
  if(!confirm('Hapus pengajuan SPPD ini?')) return;
  DB.sppd = DB.sppd.filter(s=>s.id!==id);
  DB.lpj = DB.lpj.filter(l=>l.sppdId!==id);
  saveData(DB); filterSppdTable(); toast('Pengajuan dihapus');
}

function toggleZonaField(){
  const dk = document.getElementById('f_dalamkota').value === '1';
  document.getElementById('zonaWrap').style.display = dk ? 'none' : 'block';
  updateEstimasi();
}
function readSppdForm(){
  return {
    pegawaiIds: Array.from(document.querySelectorAll('[id^="pg_"]:checked')).map(el=>el.value),
    unitId: document.getElementById('f_unit').value,
    sumberDana: document.getElementById('f_sumber').value,
    maksud: document.getElementById('f_maksud').value,
    kotaTujuan: document.getElementById('f_kota').value,
    moda: document.getElementById('f_moda').value,
    tanggalBerangkat: document.getElementById('f_berangkat').value,
    tanggalKembali: document.getElementById('f_kembali').value,
    statusDalamKota: document.getElementById('f_dalamkota').value === '1',
    zonaId: document.getElementById('f_zona').value,
    tierPenginapan: document.getElementById('f_tier').value,
    biayaTiket: Number(document.getElementById('f_tiket').value)||0,
    catatan: document.getElementById('f_catatan').value
  };
}
function toggleManualBiaya(){
  const mode=document.getElementById('f_biayaMode')?.value;
  const wrap=document.getElementById('manualBiayaWrap');
  if(wrap) wrap.style.display=mode==='manual'?'block':'none';
  updateEstimasi();
}
function toggleManualKalenderStatus(){
  const mode=document.getElementById('f_kalMode')?.value;
  const wrap=document.getElementById('manualKalWrap');
  if(wrap) wrap.style.display=mode==='manual'?'block':'none';
}
function updateEstimasi(){
  const data = readSppdForm();
  if(!data.pegawaiIds.length || !data.tanggalBerangkat || !data.tanggalKembali){
    document.getElementById('estimasiBox').innerHTML = 'Pilih pegawai dan lengkapi tanggal untuk melihat estimasi biaya otomatis.';
    return;
  }
  const temp = Object.assign({id:'tmp'}, data);
  computeBiaya(DB, temp);
  const r = temp.rincian;
  if(data.biayaMode==='manual'){
    temp.totalBiaya=data.manualTotalBiaya||0;
  }
  document.getElementById('estimasiBox').innerHTML = `
    <b>Estimasi Total Biaya: ${fmtRp(temp.totalBiaya)}</b> (${temp.lama} hari, ${temp.malam} malam, ${data.pegawaiIds.length} pegawai)<br>
    <span class="muted">Uang harian: ${fmtRp(r.harianTotal)} · Representasi: ${fmtRp(r.representasiTotal)} · Penginapan: ${fmtRp(r.penginapanTotal)} · Transport lokal: ${fmtRp(r.transportLokalTotal)} · Tiket/transport utama: ${fmtRp(r.tiket)}</span>
  `;
}
function saveSppd(id){
  const data = readSppdForm();
  if(!data.pegawaiIds.length){ toast('Pilih minimal satu pegawai'); return; }
  if(!data.maksud || !data.kotaTujuan){ toast('Lengkapi maksud dan tujuan perjalanan'); return; }
  if(data.tanggalKembali < data.tanggalBerangkat){ toast('Tanggal kembali tidak boleh sebelum tanggal berangkat'); return; }

  let s;
  if(id){
    s = DB.sppd.find(x=>x.id===id);
    Object.assign(s, data);
  } else {
    s = Object.assign({ id: uid('sppd'), nomor:'', status:'Diajukan', approvalLog:[{by:'Pemohon', action:'Mengajukan SPPD', at:new Date().toISOString()}], createdAt:new Date().toISOString() }, data);
    s.nomor = nextNomor(DB, s.unitId, s.tanggalBerangkat);
    DB.sppd.push(s);
  }
  computeBiaya(DB, s);
  if(data.biayaMode==='manual'){
    s.manualTotalBiaya=data.manualTotalBiaya||0;
    s.totalBiaya=s.manualTotalBiaya;
  }
  saveData(DB);
  closeModal();
  toast(id? 'Perubahan disimpan' : `SPPD ${s.nomor} berhasil diajukan`);
  if(VIEWS[currentView]) VIEWS[currentView].render();
}
function closeModal(){ document.getElementById('modalBg').classList.remove('open'); document.getElementById('modalBox').innerHTML=''; }

/* =========================================================
   APPROVAL
========================================================= */
function renderApproval(){
  const c = document.getElementById('content');
  const pendingAtasan = DB.sppd.filter(s=>s.status==='Diajukan');
  const pendingPpk = DB.sppd.filter(s=>s.status==='Disetujui Atasan');
  const readyTerbit = DB.sppd.filter(s=>s.status==='Disetujui PPK');

  const section = (title, list, actionLabel, nextStatus, icon) => `
    <div class="section-title"><h2>${icon} ${title}</h2><span class="hint">${list.length} pengajuan</span></div>
    <div class="table-wrap"><table>
      <thead><tr><th class="select-cell">✓</th><th>Nomor</th><th>Pegawai</th><th>Tujuan &amp; Maksud</th><th>Periode</th><th>Biaya</th><th>Aksi</th></tr></thead>
      <tbody>
        ${list.map(s=>`<tr>
          <td class="select-cell"><input class="row-check bulk-check" data-bulk-type="sppd" value="${esc(s.id)}" onchange="updateBulkCount('sppd')"></td><td>${esc(s.nomor)}</td><td>${pegawaiNames(s)}</td>
          <td>${s.kotaTujuan}<br><span class="muted">${s.maksud}</span></td>
          <td>${fmtDate(s.tanggalBerangkat)} – ${fmtDate(s.tanggalKembali)}</td>
          <td>${fmtRp(s.totalBiaya)}</td>
          <td><div class="actions-row">
            <button class="icon-btn" title="Lihat" onclick="viewSppd('${s.id}')">👁️</button><button class="icon-btn" title="Edit" onclick="openSppdModal('${s.id}')">✏️</button><button class="icon-btn" title="Hapus" onclick="deleteSppdAndRefresh('${s.id}','approval')">🗑️</button><button class="btn btn-accent btn-sm" onclick="advanceStatus('${s.id}','${nextStatus}')">✔ ${actionLabel}</button><button class="btn btn-danger btn-sm" onclick="rejectSppd('${s.id}')">✕ Tolak</button>
          </div></td>
        </tr>`).join('') || `<tr><td colspan="8"><div class="empty">Tidak ada antrean.</div></td></tr>`}
      </tbody>
    </table></div>
  `;

  c.innerHTML = `
    ${bulkToolbar('sppd','SPPD pada antrean persetujuan')}
    <div class="alert alert-info">Alur persetujuan: <b>Pemohon → Atasan Langsung → PPK/Pejabat Pembuat Komitmen → Terbit SPPD</b>, sesuai kewenangan pemberi perintah perjalanan dinas.</div>
    ${section('Menunggu Persetujuan Atasan Langsung', pendingAtasan, 'Setujui', 'Disetujui Atasan', '1️⃣')}
    ${section('Menunggu Persetujuan PPK / Pejabat Pembuat Komitmen', pendingPpk, 'Setujui', 'Disetujui PPK', '2️⃣')}
    ${section('Siap Diterbitkan SPPD', readyTerbit, 'Terbitkan SPPD', 'SPPD Terbit', '3️⃣')}
  `;
}
function advanceStatus(id, next){
  const s = DB.sppd.find(x=>x.id===id); if(!s) return;
  s.status = next;
  s.approvalLog.push({by: next.includes('Atasan')?'Atasan Langsung': next.includes('PPK')?'PPK/PA':'Sistem', action:`Status → ${next}`, at:new Date().toISOString()});
  saveData(DB); renderApproval(); toast(`${s.nomor}: status diperbarui ke "${next}"`);
}
function rejectSppd(id){
  const s = DB.sppd.find(x=>x.id===id); if(!s) return;
  const alasan = prompt('Alasan penolakan:', 'Tidak sesuai prioritas anggaran / substitusi rapat daring');
  if(alasan===null) return;
  s.status='Ditolak'; s.approvalLog.push({by:'Pejabat Berwenang', action:`Ditolak: ${alasan}`, at:new Date().toISOString()});
  saveData(DB); renderApproval(); toast(`${s.nomor} ditolak`);
}

function renderDokumen(){
  const c = document.getElementById('content');
  const opts = DB.sppd.slice().sort((a,b)=>b.tanggalBerangkat.localeCompare(a.tanggalBerangkat));
  c.innerHTML = `
    ${bulkToolbar('sppd','SPPD untuk dokumen & cetak')}
    <div class="toolbar">
      <select id="dokSelect" onchange="selectDokumen(this.value)" style="max-width:420px;">
        ${opts.map(s=>`<option value="${s.id}">${s.nomor} — ${pegawaiNames(s)} (${s.kotaTujuan})</option>`).join('') || '<option>Belum ada SPPD</option>'}
      </select>
      <div class="pill-tabs" id="dokTabs" style="margin:0;">
        <div class="pill active" data-tab="sppd" onclick="switchDokTab('sppd')">Surat Tugas / SPPD</div>
        <div class="pill" data-tab="rincian" onclick="switchDokTab('rincian')">Rincian Biaya</div>
        <div class="pill" data-tab="kuitansi" onclick="switchDokTab('kuitansi')">Kuitansi</div>
      </div>
      <button class="btn btn-primary btn-sm" onclick="window.print()">🖨️ Cetak</button>
    </div>
    <div id="dokContainer"></div>
  `;
  let currentDokTab = 'sppd';
  window.switchDokTab = (t)=>{ currentDokTab=t; document.querySelectorAll('#dokTabs .pill').forEach(p=>p.classList.toggle('active', p.dataset.tab===t)); renderDokBody(); };
  window.selectDokumen = (id)=>{ document.getElementById('dokSelect').value=id; renderDokBody(); };
  function renderDokBody(){
    const id = document.getElementById('dokSelect').value;
    const s = DB.sppd.find(x=>x.id===id);
    const html = !s ? '<div class="empty">Pilih SPPD terlebih dahulu.</div>' :
      currentDokTab==='sppd' ? docSppdHtml(s) : currentDokTab==='rincian' ? docRincianHtml(s) : docKuitansiHtml(s);
    document.getElementById('dokContainer').innerHTML = `<div class="doc-sheet">${html}</div>`;
    document.getElementById('printArea').innerHTML = `<div class="doc-sheet">${html}</div>`;
  }
  if(opts.length) renderDokBody();
}
function docHeader(){
  return `<div style="text-align:center;">
    <div style="font-weight:700; font-size:13px;">${DB.settings.namaInstansi.toUpperCase()}</div>
    <div style="font-size:11px;">Sistem Perjalanan Dinas (SiPERJADIN)</div>
  </div><hr style="margin:10px 0; border:none; border-top:2px solid #222;">`;
}
function docSppdHtml(s){
  const pegawaiRows = s.pegawaiIds.map((id,i)=>{
    const p = DB.pegawai.find(x=>x.id===id);
    return `<tr><td class="doc-num-col">${i+1}</td><td>${p.nama}<br>NIP. ${p.nip}</td><td>${p.pangkatGolongan||p.golongan}</td><td>${p.jabatan}</td></tr>`;
  }).join('');
  return `
    ${docHeader()}
    <h2>SURAT PERINTAH PERJALANAN DINAS (SPPD)</h2>
    <div class="doc-sub">Nomor: ${s.nomor}</div>
    <p style="font-size:11.6px;">Dasar: Peraturan Menteri Keuangan Nomor 113/PMK.05/2012 sebagaimana telah diubah dengan Peraturan Menteri Keuangan Nomor 119 Tahun 2023 tentang Perjalanan Dinas Dalam Negeri, dan Peraturan Menteri Keuangan Nomor 32 Tahun 2025 tentang Standar Biaya Masukan Tahun Anggaran ${DB.settings.tahunAnggaran}.</p>
    <table class="doc-table">
      <tr><th style="width:26px;">No.</th><th>Nama / NIP Pegawai yang Diperintahkan</th><th>Pangkat/Gol.</th><th>Jabatan</th></tr>
      ${pegawaiRows}
    </table>

  c.innerHTML = `
    <div class="alert alert-warn">🕐 Batas penyampaian laporan pertanggungjawaban (LPJ): <b>${DB.settings.batasLPJHari} hari kerja</b> setelah tanggal kembali (dapat disesuaikan pada menu Master Data sesuai ketentuan internal instansi).</div>

    <div class="table-wrap"><table>
      <thead><tr><th class="select-cell">✓</th><th>Nomor SPPD</th><th>Pegawai</th><th>Kembali</th><th>Jatuh Tempo LPJ</th><th>Biaya SPPD</th><th></th></tr></thead>
      <tbody>
        ${needLpj.map(s=>{
          const overdue = daysBetween(s.tanggalKembali, todayISO()) > DB.settings.batasLPJHari;
          return `<tr>
            <td class="select-cell"><input class="row-check bulk-check" data-bulk-type="sppd" value="${esc(s.id)}" onchange="updateBulkCount('sppd')"></td><td>${esc(s.nomor)}</td><td>${pegawaiNames(s)}</td><td>${fmtDate(s.tanggalKembali)}</td>
            <td>${overdue?'<span style="color:var(--danger); font-weight:700;">Lewat batas</span>':fmtDate(addBusinessDays(s.tanggalKembali, DB.settings.batasLPJHari))}</td>
            <td>${fmtRp(s.totalBiaya)}</td>
            <td><div class="actions-row"><button class="icon-btn" title="Lihat" onclick="viewSppd('${s.id}')">👁️</button><button class="icon-btn" title="Edit" onclick="openSppdModal('${s.id}')">✏️</button><button class="icon-btn" title="Hapus" onclick="deleteSppdAndRefresh('${s.id}','lpj')">🗑️</button><button class="btn btn-accent btn-sm" onclick="openLpjModal('${s.id}')">Isi LPJ</button></div></td>
          </tr>`;
        }).join('') || `<tr><td colspan="7"><div class="empty">Tidak ada tunggakan LPJ.</div></td></tr>`}
      </tbody>
    </table></div>

    ${bulkToolbar('lpj','LPJ menunggu verifikasi')}
    <div class="section-title"><h2>Menunggu Verifikasi</h2><span class="hint">${inReview.length} laporan</span></div>
    <div class="table-wrap"><table>
      <thead><tr><th class="select-cell">✓</th><th>Nomor SPPD</th><th>Tgl Lapor</th><th>Biaya SPPD</th><th>Realisasi Riil</th><th>Selisih</th><th></th></tr></thead>
      <tbody>
        ${inReview.map(l=>{
          const s = DB.sppd.find(x=>x.id===l.sppdId); if(!s) return '';
          const selisih = s.totalBiaya - l.biayaRiil;
          return `<tr>
            <td class="select-cell"><input class="row-check bulk-check" data-bulk-type="lpj" value="${esc(l.id)}" onchange="updateBulkCount('lpj')"></td><td>${esc(s.nomor)}</td><td>${fmtDate(l.tanggalLapor)}</td><td>${fmtRp(s.totalBiaya)}</td><td>${fmtRp(l.biayaRiil)}</td>
            <td style="color:${selisih>=0?'var(--accent)':'var(--danger)'}">${selisih>=0?'Lebih bayar':'Kurang bayar'} ${fmtRp(Math.abs(selisih))}</td>
            <td><div class="actions-row"><button class="icon-btn" title="Lihat" onclick="viewLpj('${l.id}')">👁️</button><button class="icon-btn" title="Edit" onclick="editLpj('${l.id}')">✏️</button><button class="icon-btn" title="Hapus" onclick="deleteLpj('${l.id}')">🗑️</button><button class="btn btn-outline btn-sm" onclick="verifyLpj('${l.id}')">✔ Verifikasi</button></div></td>

    </table></div>

    </table></div>
  `;

function addBusinessDays(dateStr, n){
  let d = new Date(dateStr+'T00:00:00'); let added=0;
  while(added<n){ d.setDate(d.getDate()+1); if(d.getDay()!==0 && d.getDay()!==6) added++; }
  return d.toISOString().slice(0,10);
}
function openLpjModal(sppdId){
  const s = DB.sppd.find(x=>x.id===sppdId);
  document.getElementById('modalBox').className='modal';
  document.getElementById('modalBox').innerHTML = `
    <div class="modal-head"><h3>Laporan Hasil Perjalanan Dinas</h3><button class="close-x" onclick="closeModal()">✕</button></div>
    <p class="muted">${s.nomor} — ${pegawaiNames(s)} — ${s.kotaTujuan}</p>
    <label>Tanggal Pelaporan</label><input type="date" id="lpj_tgl" value="${todayISO()}">

    <label>Ringkasan Hasil Pelaksanaan Tugas</label><textarea id="lpj_ringkasan" placeholder="Uraikan hasil, capaian, dan tindak lanjut dari kegiatan perjalanan dinas..."></textarea>
    <div style="height:10px;"></div>
    <label>Realisasi Biaya Riil (bukti pengeluaran)</label><input type="number" id="lpj_biaya" value="${s.totalBiaya}">
    <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:16px;">

  `;

function submitLpj(sppdId){
  const s = DB.sppd.find(x=>x.id===sppdId);
  const ringkasan = document.getElementById('lpj_ringkasan').value.trim();
  if(!ringkasan){ toast('Isi ringkasan hasil perjalanan dinas'); return; }
  DB.lpj.push({ id: uid('lpj'), sppdId, tanggalLapor: document.getElementById('lpj_tgl').value, ringkasan, biayaRiil: Number(document.getElementById('lpj_biaya').value)||s.totalBiaya, status:'Menunggu Verifikasi' });
  s.status = 'Menunggu LPJ';
  saveData(DB); closeModal(); renderLpj(); toast('LPJ berhasil dikirim, menunggu verifikasi PPK');
}
function verifyLpj(lpjId){
  const l = DB.lpj.find(x=>x.id===lpjId); if(!l) return;
  l.status='Terverifikasi';
  const s = DB.sppd.find(x=>x.id===l.sppdId); if(s) s.status='LPJ Terverifikasi';
  saveData(DB); renderLpj(); toast('LPJ terverifikasi, perjalanan dinas ditutup');
}

/* =========================================================
   BULK SELECT / DELETE
========================================================= */
function bulkToolbar(type,label='data'){
  const labels={pegawai:'pegawai',unit:'unit kerja',sppd:'SPPD/perjalanan dinas',lpj:'LPJ',hadir:'catatan daftar hadir',cal:'agenda kalender',tarif:'nilai tarif'};
  const nice=labels[type]||label||'data';
  return `<div class="bulk-tools" data-bulk-type="${type}">
    <label class="select-all-label"><input class="row-check bulk-master" type="checkbox" data-bulk-type="${type}" title="Pilih semua data" onchange="toggleAllRows(this,'${type}')"> Pilih semua</label>
    <span class="bulk-count" data-bulk-count="${type}">0 data dipilih.</span>
    <button class="btn btn-outline btn-sm" type="button" onclick="clearBulkSelection('${type}')">☐ Batal pilih</button>
    <button class="btn btn-danger btn-sm" type="button" onclick="bulkDelete('${type}')">🗑️ Hapus yang dicentang</button>
    <button class="btn btn-danger btn-sm" type="button" onclick="bulkDeleteAll('${type}')">🗑️ Hapus semua ${nice}</button>
  </div>`;
}
function selectedIds(type){return Array.from(document.querySelectorAll(`.bulk-check[data-bulk-type="${type}"]:checked`)).map(x=>x.value);}
function allRowChecks(type){return Array.from(document.querySelectorAll(`.bulk-check[data-bulk-type="${type}"]`));}
function toggleAllRows(master,type){const checks=allRowChecks(type);checks.forEach(x=>x.checked=!!master.checked);document.querySelectorAll(`.bulk-master[data-bulk-type="${type}"]`).forEach(x=>x.checked=!!master.checked);updateBulkCount(type);}
function clearBulkSelection(type){allRowChecks(type).forEach(x=>x.checked=false);document.querySelectorAll(`.bulk-master[data-bulk-type="${type}"]`).forEach(x=>x.checked=false);updateBulkCount(type);}
function updateBulkCount(type){const n=selectedIds(type).length;document.querySelectorAll(`[data-bulk-count="${type}"]`).forEach(el=>el.textContent=n?`${n} data dipilih.`:'0 data dipilih.');const checks=allRowChecks(type);const masters=document.querySelectorAll(`.bulk-master[data-bulk-type="${type}"]`);masters.forEach(m=>{m.checked=checks.length>0&&checks.every(x=>x.checked);m.indeterminate=checks.some(x=>x.checked)&&!m.checked;});}
function confirmBulkDelete(type,ids){
  const labels={pegawai:'pegawai',unit:'unit kerja',sppd:'SPPD/perjalanan dinas',lpj:'LPJ',hadir:'catatan daftar hadir',cal:'agenda kalender',tarif:'nilai tarif'};
  if(!ids.length){toast('Centang minimal satu data terlebih dahulu.');return false;}
  return confirm(`Hapus ${ids.length} ${labels[type]||'data'} yang dipilih? Tindakan ini tidak dapat dibatalkan.`);
}
function deleteAllForType(type){
  if(type==='pegawai'){DB.pegawai=[];DB.kehadiran=(DB.kehadiran||[]).filter(a=>false);DB.sppd.forEach(s=>s.pegawaiIds=[]);}
  else if(type==='unit'){DB.unitKerja=[];DB.pegawai.forEach(p=>p.unit='');DB.sppd.forEach(s=>s.unitId='');}
  else if(type==='sppd'){DB.sppd=[];DB.lpj=[];}
  else if(type==='lpj'){DB.lpj=[];}
  else if(type==='hadir'){DB.kehadiran=[];}
  else if(type==='cal'){DB.kalenderManual=[];}
  else if(type==='tarif'){
    Object.keys(DB.dalamKota||{}).forEach(k=>DB.dalamKota[k]=0);
    (DB.zona||[]).forEach(z=>z.harian=0);
    Object.keys(DB.representasi||{}).forEach(k=>DB.representasi[k]=0);
    Object.keys(DB.penginapan||{}).forEach(k=>{['tinggi','sedang','rendah'].forEach(t=>{if(DB.penginapan[k])DB.penginapan[k][t]=0;});});
    DB.transportLokal=0;
  }
}
function bulkDeleteAll(type){
  const labels={pegawai:'seluruh pegawai',unit:'seluruh unit kerja',sppd:'seluruh SPPD/perjalanan dinas',lpj:'seluruh LPJ',hadir:'seluruh catatan daftar hadir',cal:'seluruh agenda kalender',tarif:'seluruh nilai tarif'};
  const counts={pegawai:DB.pegawai.length,unit:DB.unitKerja.length,sppd:DB.sppd.length,lpj:DB.lpj.length,hadir:(DB.kehadiran||[]).length,cal:(DB.kalenderManual||[]).length,tarif:1};
  if(!confirm(`Hapus ${labels[type]||'seluruh data'}? Jumlah saat ini: ${counts[type]||0}. Tindakan ini tidak dapat dibatalkan.`))return;
  deleteAllForType(type);saveData(DB);clearBulkSelection(type);renderCurrentViewAfterBulk(type);toast(`${labels[type]||'Data'} berhasil dihapus seluruhnya.`);
}
function bulkDelete(type){
  const ids=selectedIds(type);if(!confirmBulkDelete(type,ids))return;
  const set=new Set(ids);
  if(type==='pegawai'){
    DB.pegawai=DB.pegawai.filter(p=>!set.has(p.id));DB.kehadiran=(DB.kehadiran||[]).filter(a=>!set.has(a.pegawaiId));DB.sppd.forEach(s=>s.pegawaiIds=(s.pegawaiIds||[]).filter(id=>!set.has(id)));
  }else if(type==='unit'){
    const removedUnitNames=new Set(DB.unitKerja.filter(u=>set.has(u.id)).map(u=>normalizeImportText(u.nama).toLowerCase()));DB.unitKerja=DB.unitKerja.filter(u=>!set.has(u.id));DB.pegawai.forEach(p=>{if(removedUnitNames.has(normalizeImportText(p.unit||'').toLowerCase()))p.unit='';});DB.sppd.forEach(s=>{if(set.has(s.unitId))s.unitId='';});
  }else if(type==='sppd'){DB.sppd=DB.sppd.filter(s=>!set.has(s.id));DB.lpj=DB.lpj.filter(l=>!set.has(l.sppdId));}
  else if(type==='lpj'){DB.lpj=DB.lpj.filter(l=>!set.has(l.id));}
  else if(type==='hadir'){DB.kehadiran=(DB.kehadiran||[]).filter(a=>!set.has(a.id));}
  else if(type==='cal'){DB.kalenderManual=DB.kalenderManual.filter(a=>!set.has(a.id));}
  else if(type==='tarif'){
    set.forEach(key=>{const parts=String(key).split('|');if(parts[0]==='dalam'&&DB.dalamKota[parts[1]]!==undefined)DB.dalamKota[parts[1]]=0;else if(parts[0]==='zona'){const z=DB.zona.find(x=>x.id===parts[1]);if(z)z.harian=0;}else if(parts[0]==='rep'&&DB.representasi[parts[1]]!==undefined)DB.representasi[parts[1]]=0;else if(parts[0]==='peng'){const k=parts[1],tier=parts[2];if(DB.penginapan[k]){if(tier==='all'){DB.penginapan[k].tinggi=0;DB.penginapan[k].sedang=0;DB.penginapan[k].rendah=0;}else if(DB.penginapan[k][tier]!==undefined)DB.penginapan[k][tier]=0;}}else if(parts[0]==='transport')DB.transportLokal=0;});
  }
  saveData(DB);renderCurrentViewAfterBulk(type);toast(`${ids.length} data berhasil dihapus.`);
}

function normalizeImportText(v){
  if(v===null||v===undefined)return '';
  return String(v).replace(/\u00a0/g,' ').replace(/[\r\n]+/g,' ').replace(/\s+/g,' ').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
}
function normHead(v){return normalizeImportText(v).toLowerCase().replace(/&/g,' dan ').replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'');}
function parseDelimited(text){
  const lines=String(text||'').replace(/^\uFEFF/,'').split(/\r?\n/).filter(x=>x.trim()!==''); if(!lines.length)return [];
  const first=lines[0],delimiter=first.includes('\t')?'\t':(first.includes(';')?';':',');
  return lines.map(line=>{const out=[];let cur='',quoted=false;for(let i=0;i<line.length;i++){const ch=line[i];if(ch==='"'){if(quoted&&line[i+1]==='"'){cur+='"';i++;}else quoted=!quoted;}else if(ch===delimiter&&!quoted){out.push(cur.trim());cur='';}else cur+=ch;}out.push(cur.trim());return out;});
}

function normalizeImportedDate(v){if(v instanceof Date&&!isNaN(v))return v.toISOString().slice(0,10);const s=normalizeImportText(v);if(!s)return '';let m=s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);if(m)return `${m[3]}-${String(m[2]).padStart(2,'0')}-${String(m[1]).padStart(2,'0')}`;m=s.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/);if(m)return `${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`;const d=new Date(s);return isNaN(d)?'':d.toISOString().slice(0,10);}
function normalizeAttendanceStatus(v){const s=normalizeImportText(v),n=s.toLowerCase().replace(/\s+/g,'_');if(!s)return '';if(/hadir|masuk|present/.test(n))return 'Hadir';if(/izin/.test(n))return 'Izin';if(/sakit/.test(n))return 'Sakit';if(/alpa|alpha|tanpa_keterangan/.test(n))return 'Alpa';if(/cuti/.test(n))return 'Cuti';return s;}
function normalizeGolongan(v){let s=normalizeImportText(v);if(!s)return '';s=s.replace(/golongan\s*[/\-]?\s*ruang[:\s]*/i,'').trim();const m=s.match(/\b(I|II|III|IV)\s*[/\-]\s*([a-d])\b/i);return m?`${m[1].toUpperCase()}/${m[2].toLowerCase()}`:s;}
function normalizeJabatan(v){return normalizeImportText(v).replace(/\s+/g,' ').trim();}
function normalizeUnit(v){return normalizeImportText(v).replace(/^\d+[.)\-:]\s*/,'').trim();}
function normalizeKategori(v){const s=normalizeImportText(v).toLowerCase();if(!s)return '';if(/eselon\s*i(?!i)/.test(s)||/jpt\s+madya/.test(s))return 'Eselon I';if(/eselon\s*ii\b/.test(s)||/jpt\s+pratama/.test(s))return 'Eselon II';if(/eselon\s*(iii|iv)\b/.test(s))return 'Eselon III/IV';if(/fungsional|staf|pelaksana|terampil|ahli/.test(s))return 'Fungsional/Staf';return '';}
function deriveKategoriTarif(gol,jab,raw){const direct=normalizeKategori(raw);if(direct)return direct;const j=normalizeImportText(jab).toLowerCase();if(/sekretaris\s+daerah|jpt\s+madya|eselon\s*i\b/.test(j))return 'Eselon I';if(/kepala\s+dinas|kepala\s+badan|kepala\s+biro|sekretaris\s+(dinas|badan|daerah)|asisten\s+sekda|jpt\s+pratama|eselon\s*ii\b/.test(j))return 'Eselon II';if(/kepala\s+bidang|kepala\s+bagian|kepala\s+seksi|kepala\s+sub|kabid|kabag|kasub|kasi|eselon\s*(iii|iv)\b/.test(j))return 'Eselon III/IV';return 'Fungsional/Staf';}
function cleanMasterPegawai(){
  const seenNip=new Map(),seenName=new Map(),out=[];
  (DB.pegawai||[]).forEach(p=>{const nama=cleanName(p.nama),nip=normalizeNip(p.nip),jab=normalizeJabatan(p.jabatan),gol=normalizeGolongan(p.golongan),unit=normalizeUnit(p.unit),kat=deriveKategoriTarif(gol,jab,p.kategori);if(isBadName(nama)&&!nip)return;const nk=normalizeImportText(nama).toLowerCase();const existing=nip&&seenNip.get(nip)||(!nip&&nk&&seenName.get(nk));if(existing){if(jab)existing.jabatan=jab;if(gol)existing.golongan=gol;if(unit)existing.unit=unit;if(kat)existing.kategori=kat;return;}const q=Object.assign({},p,{nama,nip,golongan:gol,jabatan:jab,kategori:kat,unit});if(nip)seenNip.set(nip,q);if(nk)seenName.set(nk,q);out.push(q);});
  DB.pegawai=out;
  const units=new Set(DB.pegawai.map(p=>normalizeUnit(p.unit)).filter(u=>u&&!isBadName(u)));units.forEach(nama=>{if(!DB.unitKerja.some(u=>normalizeImportText(u.nama).toLowerCase()===nama.toLowerCase()))DB.unitKerja.push({id:uid('u'),nama,pagu:0});});
  const validIds=new Set(DB.pegawai.map(p=>p.id));DB.kehadiran=(DB.kehadiran||[]).filter(a=>{if(a.pegawaiId&&validIds.has(a.pegawaiId))return true;const nk=normalizeImportText(a.nama||'').toLowerCase();return nk&&DB.pegawai.some(p=>normalizeImportText(p.nama).toLowerCase()===nk);}).map(a=>{const p=a.pegawaiId?DB.pegawai.find(x=>x.id===a.pegawaiId):DB.pegawai.find(x=>normalizeImportText(x.nama).toLowerCase()===normalizeImportText(a.nama||'').toLowerCase());return Object.assign(a,p?{pegawaiId:p.id,nama:p.nama,nip:p.nip}:{});});
}

async function importAttendanceRows(rows){
  if(!Array.isArray(rows)||!rows.length)return{added:0,updated:0,attendanceNew:0,attendanceUpdated:0,rows:0};
  const hd=detectImportHeader(rows);if(hd.index<0||hd.score<8)return{invalid:true};
  const header=buildImportHeader(rows,hd.index),ix={};Object.keys(IMPORT_ALIASES).forEach(k=>ix[k]=findCol(header,IMPORT_ALIASES[k]));
  if(ix.nama<0&&ix.nip<0)return{invalid:true};
  let added=0,updated=0,attendanceNew=0,attendanceUpdated=0,processed=0,skipped=0;
  const dataRows=rows.slice(hd.index+1);
  for(let start=0;start<dataRows.length;start+=50){
    const end=Math.min(start+50,dataRows.length);
    for(let ri=start;ri<end;ri++){
      const row=dataRows[ri]||[];if(!row.some(v=>normalizeImportText(v)!==''))continue;
      const rawJoined=row.map(normalizeImportText).join(' ');if(/^(total|jumlah|rekap|grand_total)\b/i.test(rawJoined))continue;
      let nip=ix.nip>=0?normalizeNip(getImportCell(row,ix.nip)):'';if(!nip)nip=extractNipFromText(rawJoined);
      let nama=ix.nama>=0?cleanName(getImportCell(row,ix.nama)):'';
      if(!nama||isBadName(nama)){const candidates=[];row.forEach((v,i)=>{if([ix.nip,ix.gol,ix.pangkat,ix.jab,ix.unit,ix.kat,ix.tanggal,ix.status,ix.masuk,ix.pulang].includes(i))return;const x=cleanName(v);if(x&&!isBadName(x))candidates.push(x);});nama=candidates[0]||'';}
      if(!nama&&!nip){skipped++;continue;} if(isBadName(nama)&&!nip){skipped++;continue;}
      const old=(nip&&DB.pegawai.find(x=>normalizeNip(x.nip)===nip))||(nama&&DB.pegawai.find(x=>normalizeImportText(x.nama).toLowerCase()===normalizeImportText(nama).toLowerCase()));
      const d={nama:nama||old?.nama||'',nip:nip||old?.nip||'',golongan:normalizeGolongan(ix.gol>=0?getImportCell(row,ix.gol):(ix.pangkat>=0?getImportCell(row,ix.pangkat):'')),jabatan:normalizeJabatan(ix.jab>=0?getImportCell(row,ix.jab):''),kategori:deriveKategoriTarif('',ix.jab>=0?getImportCell(row,ix.jab):'',ix.kat>=0?getImportCell(row,ix.kat):''),unit:normalizeUnit(ix.unit>=0?getImportCell(row,ix.unit):'')};
      let p=old;
      if(p){if(d.nama&&!isBadName(d.nama))p.nama=d.nama;if(d.nip)p.nip=d.nip;if(d.golongan)p.golongan=d.golongan;if(d.jabatan)p.jabatan=d.jabatan;if(d.kategori)p.kategori=d.kategori;if(d.unit)p.unit=d.unit;updated++;}else{p=Object.assign({id:uid('p')},{nama:d.nama,nip:d.nip,golongan:d.golongan,jabatan:d.jabatan,kategori:d.kategori||'Fungsional/Staf',unit:d.unit});DB.pegawai.push(p);added++;}
      if(d.unit&&!DB.unitKerja.some(u=>normalizeImportText(u.nama).toLowerCase()===d.unit.toLowerCase()))DB.unitKerja.push({id:uid('u'),nama:d.unit,pagu:0});
      const tanggal=ix.tanggal>=0?normalizeImportedDate(getImportCell(row,ix.tanggal)):'';const status=ix.status>=0?normalizeAttendanceStatus(getImportCell(row,ix.status)):'';const masuk=ix.masuk>=0?getImportCell(row,ix.masuk):'';const pulang=ix.pulang>=0?getImportCell(row,ix.pulang):'';
      if(tanggal||status||masuk||pulang){const keyDate=tanggal||todayISO();let a=DB.kehadiran.find(x=>x.pegawaiId===p.id&&x.tanggal===keyDate);if(a){a.nama=p.nama;a.nip=p.nip;if(status)a.status=status;if(masuk)a.jamMasuk=masuk;if(pulang)a.jamPulang=pulang;a.sumber='Impor daftar hadir';attendanceUpdated++;}else{DB.kehadiran.push({id:uid('hadir'),pegawaiId:p.id,nama:p.nama,nip:p.nip,tanggal:keyDate,status:status||'Hadir',jamMasuk:masuk,jamPulang:pulang,sumber:'Impor daftar hadir'});attendanceNew++;}}
      processed++;
    }
    showImportLoading('Mengolah data daftar hadir…',`Memproses baris ${end} dari ${dataRows.length}. Memetakan Nama, NIP, Golongan, Jabatan, Kategori Tarif, Unit Kerja dan Kehadiran.`,Math.round(end/Math.max(1,dataRows.length)*100));await nextImportFrame();
  }
  cleanMasterPegawai();saveData(DB);return{added,updated,attendanceNew,attendanceUpdated,rows:processed,skipped,headerRow:hd.index+1};
}
async function importPegawaiFile(file){
  if(!file)return;showImportLoading('Membaca file…','Menyiapkan data untuk diproses.',5);
  try{const name=(file.name||'').toLowerCase();let rows=[];
    if(name.endsWith('.json')){const j=JSON.parse(await file.text());if(Array.isArray(j)&&j.length){const keys=[...new Set(j.flatMap(x=>Object.keys(x||{})))];rows=[keys,...j.map(x=>keys.map(k=>x?.[k]??''))];}}
    else{const buf=await file.arrayBuffer();const isText=/\.(csv|tsv|txt)$/i.test(name);if(!isText){if(!window.XLSX)throw new Error('Library Excel belum termuat. Silakan tunggu halaman selesai dimuat lalu coba lagi.');const wb=XLSX.read(buf,{type:'array',cellDates:true,raw:false});let ws=null;for(const sn of wb.SheetNames){const candidate=wb.Sheets[sn];const test=XLSX.utils.sheet_to_json(candidate,{header:1,defval:'',raw:false,blankrows:false});if(test.length){ws=candidate;break;}}if(!ws)throw new Error('Tidak ditemukan tabel pada file Excel.');rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:false,blankrows:false});}else rows=parseDelimited(new TextDecoder('utf-8').decode(buf));}
    showImportLoading('Menganalisis struktur data…','Menentukan posisi setiap kolom dan memeriksa data pegawai.',15);await nextImportFrame();const r=await importAttendanceRows(rows);if(r.invalid){hideImportLoading();toast('Data terbaca, tetapi header Nama/NIP tidak dikenali. Tidak ada data yang dimasukkan.');return;}renderMasterBody();hideImportLoading();toast(`Impor: ${r.added} baru, ${r.updated} diperbarui, ${r.attendanceNew+r.attendanceUpdated} catatan hadir`);
  }catch(e){console.error(e);hideImportLoading();toast(`Impor gagal: ${e.message||'format file tidak dikenali'}`);}
}
