<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SiPERJADIN - Sistem Perjalanan Dinas</title>
<style>
:root{
  --brand:#0d5c8c; --brand-dark:#093f60; --brand-light:#e7f2f8;
  --accent:#0e8a6d; --accent-light:#e5f6f1;
  --warn:#b5791a; --warn-light:#fbf1de;
  --danger:#b3261e; --danger-light:#fce8e6;
  --bg:#f4f6f8; --card:#ffffff; --text:#1c2530; --text-soft:#5b6b7a;
  --border:#e1e6ea; --radius:14px; --shadow:0 2px 10px rgba(20,40,60,.06);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12181f; --card:#1a2229; --text:#eaf0f5; --text-soft:#9aacba;
    --border:#2b3844; --brand-light:#173044; --accent-light:#123b31;
    --warn-light:#3a2e12; --danger-light:#3a1b18;
  }
}
:root[data-theme="dark"]{
  --bg:#12181f; --card:#1a2229; --text:#eaf0f5; --text-soft:#9aacba;
  --border:#2b3844; --brand-light:#173044; --accent-light:#123b31;
  --warn-light:#3a2e12; --danger-light:#3a1b18;
}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%;}
body{
  margin:0; height:100%; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;}
button{font-family:inherit; cursor:pointer;}
input,select,textarea{font-family:inherit; font-size:14px;}

/* ---------- App shell ---------- */
#app{display:flex; min-height:100vh;}
.sidebar{
  width:230px; flex:0 0 230px; background:linear-gradient(180deg,var(--brand-dark),var(--brand));
  color:#fff; padding:18px 0; position:sticky; top:0; height:100vh; overflow-y:auto;
  padding-top:calc(18px + env(safe-area-inset-top,0px));
}
.brand{display:flex; align-items:center; gap:10px; padding:0 18px 16px; border-bottom:1px solid rgba(255,255,255,.15); margin-bottom:10px;}
.brand-badge{width:38px; height:38px; border-radius:10px; background:rgba(255,255,255,.15); display:flex; align-items:center; justify-content:center; font-size:20px;}
.brand-name{font-weight:700; font-size:15px; line-height:1.2;}
.brand-sub{font-size:10.5px; opacity:.75; letter-spacing:.3px;}
.nav-item{
  display:flex; align-items:center; gap:10px; padding:10px 18px; font-size:13.5px;
  color:rgba(255,255,255,.82); cursor:pointer; border-left:3px solid transparent; white-space:nowrap;
}
.nav-item:hover{background:rgba(255,255,255,.08);}
.nav-item.active{background:rgba(255,255,255,.14); border-left-color:#fff; color:#fff; font-weight:600;}
.nav-icon{width:18px; text-align:center; font-size:15px;}
.nav-section-label{font-size:10px; text-transform:uppercase; letter-spacing:.6px; opacity:.55; padding:14px 18px 4px;}

.main{flex:1; min-width:0; display:flex; flex-direction:column;}
.topbar{
  position:sticky; top:0; z-index:5; background:var(--card); border-bottom:1px solid var(--border);
  padding:14px 22px; padding-top:calc(14px + env(safe-area-inset-top,0px));
  display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
}
.topbar h1{font-size:17px; margin:0;}
.topbar .sub{font-size:12px; color:var(--text-soft); margin-top:2px;}
.top-actions{display:flex; gap:8px; align-items:center;}
.menu-toggle{display:none; background:none; border:1px solid var(--border); border-radius:8px; padding:7px 10px; color:var(--text);}
.content{padding:20px 22px 60px; max-width:1280px; width:100%; margin:0 auto;}

/* ---------- Generic components ---------- */
.grid{display:grid; gap:14px;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
@media (max-width:980px){.grid-4{grid-template-columns:repeat(2,1fr);} .grid-3{grid-template-columns:repeat(2,1fr);} .grid-2{grid-template-columns:1fr;}}
@media (max-width:640px){.grid-4{grid-template-columns:1fr;}}

.card{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); padding:18px;}
.card h3{margin:0 0 4px; font-size:14px;}
.card .muted{color:var(--text-soft); font-size:12.5px;}

.stat-card{display:flex; flex-direction:column; gap:6px;}
.stat-top{display:flex; justify-content:space-between; align-items:flex-start;}
.stat-icon{width:36px; height:36px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:17px;}
.stat-val{font-size:24px; font-weight:700;}
.stat-label{font-size:12.5px; color:var(--text-soft);}
.stat-trend{font-size:11.5px; font-weight:600; padding:2px 7px; border-radius:20px;}

.section-title{display:flex; align-items:center; justify-content:space-between; margin:26px 0 12px;}
.section-title h2{font-size:15.5px; margin:0;}
.section-title .hint{font-size:12px; color:var(--text-soft);}

.btn{border:none; border-radius:9px; padding:9px 15px; font-size:13px; font-weight:600; display:inline-flex; align-items:center; gap:6px; transition:filter .15s;}
.btn:hover{filter:brightness(1.06);}
.btn:active{filter:brightness(.94);}
.btn-primary{background:var(--brand); color:#fff;}
.btn-accent{background:var(--accent); color:#fff;}
.btn-outline{background:transparent; border:1px solid var(--border); color:var(--text);}
.btn-danger{background:var(--danger); color:#fff;}
.btn-warn{background:var(--warn); color:#fff;}
.btn-sm{padding:6px 10px; font-size:12px; border-radius:7px;}
.btn[disabled]{opacity:.45; cursor:not-allowed;}

.badge{display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:700; padding:3px 9px; border-radius:20px; white-space:nowrap;}
.b-draft{background:#eceff1; color:#546069;}
.b-diajukan{background:var(--warn-light); color:var(--warn);}
.b-atasan{background:#e6ecfb; color:#3453b3;}
.b-ppk{background:#eee3fb; color:#6d33b3;}
.b-terbit{background:var(--brand-light); color:var(--brand);}
.b-berjalan{background:#e0f3fb; color:#0c7fb0;}
.b-selesai{background:var(--accent-light); color:var(--accent);}
.b-lpj{background:#fff1da; color:#a5680b;}
.b-tutup{background:#e4f7ec; color:#1b8a52;}
.b-tolak{background:var(--danger-light); color:var(--danger);}

table{width:100%; border-collapse:collapse; font-size:13px;}
th{text-align:left; font-size:11.5px; text-transform:uppercase; letter-spacing:.3px; color:var(--text-soft); padding:9px 10px; border-bottom:1px solid var(--border); white-space:nowrap;}
td{padding:10px 10px; border-bottom:1px solid var(--border); vertical-align:top;}
tr:last-child td{border-bottom:none;}
.table-wrap{overflow-x:auto; border-radius:12px; border:1px solid var(--border);}
.table-wrap table{min-width:640px;}
.table-wrap.tight table{min-width:0;}

.form-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px 16px;}
@media (max-width:700px){.form-grid{grid-template-columns:1fr;}}
.form-grid .full{grid-column:1/-1;}
label{display:block; font-size:12.5px; font-weight:600; margin-bottom:5px; color:var(--text-soft);}
input[type=text],input[type=number],input[type=date],select,textarea{
  width:100%; padding:9px 11px; border:1px solid var(--border); border-radius:9px; background:var(--bg); color:var(--text);
}
textarea{resize:vertical; min-height:64px;}
.checkline{display:flex; align-items:center; gap:8px; padding:8px 10px; border:1px solid var(--border); border-radius:9px; margin-bottom:6px; font-size:13px; background:var(--bg);}
.checkline input{width:auto;}

.modal-bg{position:fixed; inset:0; background:rgba(10,18,26,.55); display:none; align-items:flex-start; justify-content:center; z-index:50; padding:26px 14px; overflow-y:auto;}
.modal-bg.open{display:flex;}
.modal{background:var(--card); border-radius:16px; width:100%; max-width:760px; padding:22px; box-shadow:0 20px 60px rgba(0,0,0,.3); margin-bottom:40px;}
.modal.wide{max-width:920px;}
.modal-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;}
.modal-head h3{margin:0; font-size:16px;}
.close-x{background:none; border:none; font-size:20px; color:var(--text-soft); padding:2px 6px;}

.pill-tabs{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:16px;}
.pill{padding:7px 13px; border-radius:20px; font-size:12.5px; font-weight:600; border:1px solid var(--border); background:var(--card); color:var(--text-soft);}
.pill.active{background:var(--brand); color:#fff; border-color:var(--brand);}

.alert{border-radius:10px; padding:11px 14px; font-size:12.8px; display:flex; gap:9px; align-items:flex-start; margin-bottom:14px;}
.alert-info{background:var(--brand-light); color:var(--brand-dark);}
.alert-warn{background:var(--warn-light); color:var(--warn);}
.alert-danger{background:var(--danger-light); color:var(--danger);}
.alert-ok{background:var(--accent-light); color:var(--accent);}

.timeline{list-style:none; margin:0; padding:0;}
.timeline li{display:flex; gap:12px; padding:9px 0; border-bottom:1px dashed var(--border);}
.timeline li:last-child{border-bottom:none;}
.tl-dot{width:9px; height:9px; border-radius:50%; background:var(--brand); margin-top:5px; flex:0 0 9px;}
.tl-dot.dim{background:var(--border);}
.tl-body b{font-size:12.8px;}
.tl-body .when{font-size:11.3px; color:var(--text-soft);}

.bar-chart{display:flex; align-items:flex-end; gap:10px; height:150px; padding:6px 4px;}
.bar-col{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; gap:6px;}
.bar-fill{width:100%; max-width:34px; border-radius:6px 6px 2px 2px; background:linear-gradient(180deg,var(--brand),var(--brand-dark)); min-height:3px;}
.bar-label{font-size:10.5px; color:var(--text-soft);}
.bar-val{font-size:10px; color:var(--text-soft); font-weight:700;}

.donut-wrap{display:flex; align-items:center; gap:18px; flex-wrap:wrap;}
.donut{width:120px; height:120px; border-radius:50%; flex:0 0 120px;}
.legend{display:flex; flex-direction:column; gap:6px; font-size:12px;}
.legend-item{display:flex; align-items:center; gap:7px;}
.dot{width:9px; height:9px; border-radius:50%;}

.empty{text-align:center; padding:34px 10px; color:var(--text-soft); font-size:13px;}
.icon-btn{background:var(--bg); border:1px solid var(--border); border-radius:8px; width:30px; height:30px; display:inline-flex; align-items:center; justify-content:center; font-size:13px; color:var(--text);}
.actions-row{display:flex; gap:6px; flex-wrap:wrap;}
.search-box{display:flex; align-items:center; gap:8px; background:var(--bg); border:1px solid var(--border); border-radius:9px; padding:8px 12px; flex:1; min-width:180px;}
.search-box input{border:none; background:transparent; padding:0; flex:1;}
.toolbar{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:14px;}

.doc-sheet{background:#fff; color:#111; border-radius:6px; padding:34px 38px; font-size:12.6px; line-height:1.55; border:1px solid var(--border); max-width:760px; margin:0 auto;}
.doc-sheet h2{text-align:center; font-size:14px; margin:2px 0; text-decoration:underline;}
.doc-sheet .doc-sub{text-align:center; font-size:11.5px; margin-bottom:14px;}
.doc-table{width:100%; border-collapse:collapse; margin:10px 0;}
.doc-table td,.doc-table th{border:1px solid #444; padding:6px 8px; font-size:11.8px; vertical-align:top;}
.doc-num-col{width:26px; text-align:center;}
.sig-block{display:flex; justify-content:flex-end; margin-top:26px;}
.sig-inner{text-align:center; font-size:12px; width:230px;}
.sig-inner .space{height:60px;}
@media print{
  body *{visibility:hidden;}
  #printArea, #printArea *{visibility:visible;}
  #printArea{position:absolute; top:0; left:0; width:100%;}
  .no-print{display:none !important;}
}

.toast-wrap{position:fixed; bottom:calc(18px + env(safe-area-inset-bottom,0px)); right:18px; display:flex; flex-direction:column; gap:8px; z-index:80;}
.toast{background:var(--brand-dark); color:#fff; padding:10px 16px; border-radius:9px; font-size:12.8px; box-shadow:0 8px 20px rgba(0,0,0,.25); animation:fadein .2s ease;}
@keyframes fadein{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

.law-card{border-left:4px solid var(--brand); padding:12px 14px; background:var(--bg); border-radius:0 10px 10px 0; margin-bottom:12px;}
.law-card b{font-size:13px;}
.law-card p{margin:5px 0 0; font-size:12.6px; color:var(--text-soft);}

.progress-bar{height:9px; border-radius:6px; background:var(--border); overflow:hidden;}
.progress-fill{height:100%; border-radius:6px; background:var(--accent);}

@media (max-width:900px){
  .sidebar{position:fixed; left:0; top:0; bottom:0; z-index:40; transform:translateX(-100%); transition:transform .2s ease; box-shadow:0 0 30px rgba(0,0,0,.3);}
  .sidebar.open{transform:translateX(0);}
  .menu-toggle{display:inline-flex;}
  .sidebar-backdrop{display:none; position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:35;}
  .sidebar-backdrop.open{display:block;}
}
</style>
</head>
<body>
<div id="app">
  <div class="sidebar-backdrop no-print" id="sbBackdrop" onclick="toggleSidebar(false)"></div>
  <nav class="sidebar no-print" id="sidebar">
    <div class="brand">
      <div class="brand-badge">🧭</div>
      <div>
        <div class="brand-name">SiPERJADIN</div>
        <div class="brand-sub">Sistem Perjalanan Dinas</div>
      </div>
    </div>
    <div class="nav-section-label">Menu Utama</div>
    <div class="nav-item" data-view="dashboard"><span class="nav-icon">📊</span> Dashboard</div>
    <div class="nav-item" data-view="perencanaan"><span class="nav-icon">🗓️</span> Perencanaan Perjadin</div>
    <div class="nav-item" data-view="pengajuan"><span class="nav-icon">📝</span> Pengajuan SPPD</div>
    <div class="nav-item" data-view="approval"><span class="nav-icon">✅</span> Persetujuan</div>
    <div class="nav-item" data-view="dokumen"><span class="nav-icon">📄</span> Dokumen &amp; Cetak</div>
    <div class="nav-item" data-view="lpj"><span class="nav-icon">📥</span> Laporan &amp; LPJ</div>
    <div class="nav-section-label">Kelola</div>
    <div class="nav-item" data-view="anggaran"><span class="nav-icon">💰</span> Anggaran</div>
    <div class="nav-item" data-view="master"><span class="nav-icon">🗂️</span> Master Data &amp; Tarif</div>
    <div class="nav-item" data-view="hukum"><span class="nav-icon">⚖️</span> Dasar Hukum</div>
  </nav>

  <div class="main">
    <div class="topbar no-print">
      <div style="display:flex; align-items:center; gap:10px;">
        <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
        <div>
          <h1 id="viewTitle">Dashboard</h1>
          <div class="sub" id="viewSub">Ringkasan perjalanan dinas &amp; anggaran</div>
        </div>
      </div>
      <div class="top-actions">
        <button class="btn btn-outline btn-sm" onclick="toggleTheme()">🌓 Tema</button>
        <button class="btn btn-primary btn-sm" onclick="openSppdModal()">+ SPPD Baru</button>
      </div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<div class="modal-bg no-print" id="modalBg"><div class="modal" id="modalBox"></div></div>
<div class="toast-wrap no-print" id="toastWrap"></div>
<div id="printArea" style="display:none;"></div>

<script>
/* =========================================================
   SiPERJADIN — data layer
========================================================= */
const STORE_KEY = 'siperjadin_v1';
const todayISO = () => new Date().toISOString().slice(0,10);
const fmtRp = n => 'Rp' + Math.round(n||0).toLocaleString('id-ID');
const fmtDate = d => d ? new Date(d+'T00:00:00').toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'}) : '-';
const daysBetween = (a,b) => Math.round((new Date(b) - new Date(a))/86400000) + 1;
const uid = p => p + '-' + Math.random().toString(36).slice(2,8);

function seedData(){
  return {
    settings:{ tahunAnggaran:2026, batasLPJHari:5, namaInstansi:'Instansi Pemerintah Contoh', kotaInstansi:'Kupang' },
    pegawai:[
      {id:'p1', nama:'Dr. Andreas Bimo, S.T., M.T.', nip:'197805122005011009', golongan:'IV/c', jabatan:'Sekretaris Direktorat Jenderal', kategori:'Eselon I', unit:'Sekretariat Ditjen'},
      {id:'p2', nama:'Sri Wahyuni, S.E., M.M.', nip:'198203142006042003', golongan:'IV/a', jabatan:'Kepala Bagian Perencanaan', kategori:'Eselon II', unit:'Biro Perencanaan'},
      {id:'p3', nama:'Fajar Nugraha, S.Kom.', nip:'198906302011011005', golongan:'III/d', jabatan:'Kepala Subbagian Data', kategori:'Eselon III/IV', unit:'Biro Perencanaan'},
      {id:'p4', nama:'Melati Kusuma, A.Md.', nip:'199202152015022001', golongan:'III/a', jabatan:'Analis Kepegawaian', kategori:'Fungsional/Staf', unit:'Biro SDM'},
      {id:'p5', nama:'Yohanes Rian Making', nip:'199512012019031004', golongan:'II/c', jabatan:'Pengelola Keuangan', kategori:'Fungsional/Staf', unit:'Biro Keuangan'},
      {id:'p6', nama:'Ratna Dewi Sartika, S.H.', nip:'198711232012042002', golongan:'III/c', jabatan:'Kepala Subbagian Hukum', kategori:'Eselon III/IV', unit:'Biro Hukum'}
    ],
    unitKerja:[
      {id:'u1', nama:'Sekretariat Ditjen', pagu:450000000},
      {id:'u2', nama:'Biro Perencanaan', pagu:280000000},
      {id:'u3', nama:'Biro SDM', pagu:180000000},
      {id:'u4', nama:'Biro Keuangan', pagu:150000000},
      {id:'u5', nama:'Biro Hukum', pagu:120000000}
    ],
    zona:[
      {id:'z1', nama:'Zona 1 (mis. Aceh, Sumut, Kalimantan)', harian:360000},
      {id:'z2', nama:'Zona 2 (mis. Sumatera lain, Jawa, Bali)', harian:430000},
      {id:'z3', nama:'Zona 3 (mis. NTB, NTT, Sulawesi)', harian:480000},
      {id:'z4', nama:'Zona 4 (mis. Maluku, sebagian Kalimantan)', harian:530000},
      {id:'z5', nama:'Zona 5 (Papua &amp; sekitarnya)'.replace('&amp;','&'), harian:580000}
    ],
    dalamKota:{ umum:230000, diklat:170000 },
    representasi:{ 'Eselon I':130000, 'Eselon II':65000, 'Eselon III/IV':0, 'Fungsional/Staf':0 },
    penginapan:{
      'Eselon I':{tinggi:9331000, sedang:5200000, rendah:2140000},
      'Eselon II':{tinggi:4200000, sedang:2600000, rendah:1300000},
      'Eselon III/IV':{tinggi:1900000, sedang:1200000, rendah:750000},
      'Fungsional/Staf':{tinggi:1200000, sedang:800000, rendah:500000}
    },
    transportLokal: 196000,
    sppd:[],
    lpj:[],
    seq:1
  };
}

function loadData(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw){ return JSON.parse(raw); }
  }catch(e){ console.warn('storage read failed', e); }
  const seeded = seedData();
  seedSppdExamples(seeded);
  saveData(seeded);
  return seeded;
}
function saveData(d){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(d)); }
  catch(e){ console.warn('storage write failed', e); }
}

function seedSppdExamples(d){
  const mk = (over) => {
    const base = {
      id: uid('sppd'), nomor:'', maksud:'Rapat koordinasi', kotaTujuan:'Jakarta', zonaId:'z2',
      tanggalBerangkat: todayISO(), tanggalKembali: todayISO(), moda:'Pesawat Udara',
      unitId:'u2', sumberDana:'DIPA/RKA Unit Kerja', pegawaiIds:['p2'], statusDalamKota:false,
      biayaTiket:1800000, status:'Terbit', catatan:'', createdAt: new Date().toISOString(),
      approvalLog:[]
    };
    return Object.assign(base, over);
  };
  const items = [
    mk({ maksud:'Koordinasi program tahun anggaran', kotaTujuan:'Jakarta', zonaId:'z2', pegawaiIds:['p1'], unitId:'u1', tanggalBerangkat:addDays(-12), tanggalKembali:addDays(-10), status:'Selesai', biayaTiket:2200000 }),
    mk({ maksud:'Bimbingan teknis pengelolaan keuangan', kotaTujuan:'Surabaya', zonaId:'z2', pegawaiIds:['p5'], unitId:'u4', tanggalBerangkat:addDays(-6), tanggalKembali:addDays(-4), status:'Menunggu LPJ', biayaTiket:1500000 }),
    mk({ maksud:'Rapat harmonisasi regulasi', kotaTujuan:'Kupang', zonaId:'z3', pegawaiIds:['p6'], unitId:'u5', tanggalBerangkat:addDays(2), tanggalKembali:addDays(3), status:'SPPD Terbit', biayaTiket:1650000 }),
    mk({ maksud:'Monitoring dan evaluasi lapangan', kotaTujuan:'Jayapura', zonaId:'z5', pegawaiIds:['p3'], unitId:'u2', tanggalBerangkat:addDays(5), tanggalKembali:addDays(8), status:'Diajukan', biayaTiket:5200000 }),
    mk({ maksud:'Diklat penguatan kapasitas SDM', kotaTujuan:'Bandung', zonaId:'z2', pegawaiIds:['p4'], unitId:'u3', tanggalBerangkat:addDays(9), tanggalKembali:addDays(11), status:'Disetujui Atasan', biayaTiket:900000 })
  ];
  items.forEach(it => { it.nomor = nextNomor(d, it.unitId, it.tanggalBerangkat); computeBiaya(d, it); d.sppd.push(it); });
  d.lpj.push({ id: uid('lpj'), sppdId: items[1].id, tanggalLapor: addDays(-2), ringkasan:'Kegiatan bimtek terlaksana sesuai jadwal, seluruh peserta unit kerja daerah hadir.', biayaRiil: items[1].totalBiaya - 150000, status:'Menunggu Verifikasi' });
}
function addDays(n){ const dt = new Date(); dt.setDate(dt.getDate()+n); return dt.toISOString().slice(0,10); }

let DB = loadData();

/* ---------- business logic ---------- */
function nextNomor(d, unitId, tglBerangkat){
  const unit = d.unitKerja.find(u=>u.id===unitId);
  const kode = unit ? unit.nama.split(' ').map(w=>w[0]).join('').toUpperCase() : 'UM';
  const n = d.seq++;
  const dt = new Date(tglBerangkat || todayISO());
  const bulanRomawi = ['I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII'][dt.getMonth()];
  return String(n).padStart(3,'0') + '/SPPD/' + kode + '/' + bulanRomawi + '/' + dt.getFullYear();
}

function computeBiaya(d, s){
  const lama = Math.max(1, daysBetween(s.tanggalBerangkat, s.tanggalKembali));
  const malam = Math.max(0, lama - 1);
  const zona = d.zona.find(z=>z.id===s.zonaId) || d.zona[0];
  const pegawaiList = s.pegawaiIds.map(id => d.pegawai.find(p=>p.id===id)).filter(Boolean);
  let harianTotal=0, representasiTotal=0, penginapanTotal=0;
  const tierPenginapan = s.tierPenginapan || 'sedang';
  pegawaiList.forEach(p=>{
    const rateHarian = s.statusDalamKota ? d.dalamKota.umum : zona.harian;
    harianTotal += rateHarian * lama;
    representasiTotal += (d.representasi[p.kategori]||0) * lama;
    const pRate = (d.penginapan[p.kategori]||d.penginapan['Fungsional/Staf'])[tierPenginapan];
    penginapanTotal += s.statusDalamKota ? 0 : pRate * malam;
  });
  const transportLokalTotal = pegawaiList.length * d.transportLokal * (s.statusDalamKota?0:2);
  const tiket = s.statusDalamKota ? 0 : (s.biayaTiket||0) * pegawaiList.length;
  s.lama = lama; s.malam = malam;
  s.rincian = { harianTotal, representasiTotal, penginapanTotal, transportLokalTotal, tiket };
  s.totalBiaya = harianTotal + representasiTotal + penginapanTotal + transportLokalTotal + tiket;
  return s;
}

const STATUS_FLOW = ['Diajukan','Disetujui Atasan','Disetujui PPK','SPPD Terbit','Sedang Berjalan','Selesai','Menunggu LPJ','LPJ Terverifikasi'];
function statusBadgeClass(st){
  return ({
    'Draft':'b-draft','Diajukan':'b-diajukan','Disetujui Atasan':'b-atasan','Disetujui PPK':'b-ppk',
    'SPPD Terbit':'b-terbit','Sedang Berjalan':'b-berjalan','Selesai':'b-selesai',
    'Menunggu LPJ':'b-lpj','LPJ Terverifikasi':'b-tutup','Ditolak':'b-tolak'
  })[st] || 'b-draft';
}
function autoAdvanceByDate(d){
  const t = todayISO();
  d.sppd.forEach(s=>{
    if(s.status==='SPPD Terbit' && s.tanggalBerangkat<=t && s.tanggalKembali>=t){ s.status='Sedang Berjalan'; }
    if(s.status==='Sedang Berjalan' && s.tanggalKembali<t){ s.status='Selesai'; }
    if(s.status==='Selesai'){
      const lpj = d.lpj.find(l=>l.sppdId===s.id);
      if(!lpj) s.status='Menunggu LPJ';
    }
  });
}

  document.getElementById('modalBg').classList.add('open');
  toggleZonaField();
  ['f_unit','f_maksud','f_kota','f_moda','f_berangkat','f_kembali','f_dalamkota','f_zona','f_tier','f_tiket']
    .forEach(id=>document.getElementById(id).addEventListener('input', updateEstimasi));
  document.querySelectorAll('[id^="pg_"]').forEach(el=>el.addEventListener('change', updateEstimasi));
  updateEstimasi();
}
function toggleZonaField(){
  const dk = document.getElementById('f_dalamkota').value === '1';
  document.getElementById('zonaWrap').style.display = dk ? 'none' : 'block';
  updateEstimasi();
}
function readSppdForm(){
  return {
    pegawaiIds: Array.from(document.querySelectorAll('[id^="pg_"]:checked')).map(el=>el.value),
    unitId: document.getElementById('f_unit').value,
    sumberDana: document.getElementById('f_sumber').value,
    maksud: document.getElementById('f_maksud').value,
    kotaTujuan: document.getElementById('f_kota').value,
    moda: document.getElementById('f_moda').value,
    tanggalBerangkat: document.getElementById('f_berangkat').value,
    tanggalKembali: document.getElementById('f_kembali').value,
    statusDalamKota: document.getElementById('f_dalamkota').value === '1',
    zonaId: document.getElementById('f_zona').value,
    tierPenginapan: document.getElementById('f_tier').value,
    biayaTiket: Number(document.getElementById('f_tiket').value)||0,
    catatan: document.getElementById('f_catatan').value
  };
}
function updateEstimasi(){
  const data = readSppdForm();
  if(!data.pegawaiIds.length || !data.tanggalBerangkat || !data.tanggalKembali){
    document.getElementById('estimasiBox').innerHTML = 'Pilih pegawai dan lengkapi tanggal untuk melihat estimasi biaya otomatis.';
    return;
  }
  const temp = Object.assign({id:'tmp'}, data);
  computeBiaya(DB, temp);
  const r = temp.rincian;
  document.getElementById('estimasiBox').innerHTML = `
    <b>Estimasi Total Biaya: ${fmtRp(temp.totalBiaya)}</b> (${temp.lama} hari, ${temp.malam} malam, ${data.pegawaiIds.length} pegawai)<br>
    <span class="muted">Uang harian: ${fmtRp(r.harianTotal)} · Representasi: ${fmtRp(r.representasiTotal)} · Penginapan: ${fmtRp(r.penginapanTotal)} · Transport lokal: ${fmtRp(r.transportLokalTotal)} · Tiket/transport utama: ${fmtRp(r.tiket)}</span>
  `;
}
function saveSppd(id){
  const data = readSppdForm();
  if(!data.pegawaiIds.length){ toast('Pilih minimal satu pegawai'); return; }
  if(!data.maksud || !data.kotaTujuan){ toast('Lengkapi maksud dan tujuan perjalanan'); return; }
  if(data.tanggalKembali < data.tanggalBerangkat){ toast('Tanggal kembali tidak boleh sebelum tanggal berangkat'); return; }

  let s;
  if(id){
    s = DB.sppd.find(x=>x.id===id);
    Object.assign(s, data);
  } else {
    s = Object.assign({ id: uid('sppd'), nomor:'', status:'Diajukan', approvalLog:[{by:'Pemohon', action:'Mengajukan SPPD', at:new Date().toISOString()}], createdAt:new Date().toISOString() }, data);
    s.nomor = nextNomor(DB, s.unitId, s.tanggalBerangkat);
    DB.sppd.push(s);
  }
  computeBiaya(DB, s);
  saveData(DB);
  closeModal();
  toast(id? 'Perubahan disimpan' : `SPPD ${s.nomor} berhasil diajukan`);
  if(VIEWS[currentView]) VIEWS[currentView].render();
}
function closeModal(){ document.getElementById('modalBg').classList.remove('open'); document.getElementById('modalBox').innerHTML=''; }

========================================================= */
function renderApproval(){
  const c = document.getElementById('content');
  const pendingAtasan = DB.sppd.filter(s=>s.status==='Diajukan');
  const pendingPpk = DB.sppd.filter(s=>s.status==='Disetujui Atasan');
  const readyTerbit = DB.sppd.filter(s=>s.status==='Disetujui PPK');

  const section = (title, list, actionLabel, nextStatus, icon) => `
    <div class="section-title"><h2>${icon} ${title}</h2><span class="hint">${list.length} pengajuan</span></div>
    <div class="table-wrap"><table>
      <thead><tr><th>Nomor</th><th>Pegawai</th><th>Tujuan &amp; Maksud</th><th>Periode</th><th>Biaya</th><th></th></tr></thead>
      <tbody>
        ${list.map(s=>`<tr>
          <td>${s.nomor}</td><td>${pegawaiNames(s)}</td>
          <td>${s.kotaTujuan}<br><span class="muted">${s.maksud}</span></td>
          <td>${fmtDate(s.tanggalBerangkat)} – ${fmtDate(s.tanggalKembali)}</td>
          <td>${fmtRp(s.totalBiaya)}</td>
          <td><div class="actions-row">
            <button class="btn btn-accent btn-sm" onclick="advanceStatus('${s.id}','${nextStatus}')">✔ ${actionLabel}</button>
            <button class="btn btn-danger btn-sm" onclick="rejectSppd('${s.id}')">✕ Tolak</button>
          </div></td>
        </tr>`).join('') || `<tr><td colspan="6"><div class="empty">Tidak ada antrean.</div></td></tr>`}
      </tbody>
    </table></div>
  `;

  c.innerHTML = `
    <div class="alert alert-info">Alur persetujuan: <b>Pemohon → Atasan Langsung → PPK/Pejabat Pembuat Komitmen → Terbit SPPD</b>, sesuai kewenangan pemberi perintah perjalanan dinas.</div>
    ${section('Menunggu Persetujuan Atasan Langsung', pendingAtasan, 'Setujui', 'Disetujui Atasan', '1️⃣')}
    ${section('Menunggu Persetujuan PPK / Pejabat Pembuat Komitmen', pendingPpk, 'Setujui', 'Disetujui PPK', '2️⃣')}
    ${section('Siap Diterbitkan SPPD', readyTerbit, 'Terbitkan SPPD', 'SPPD Terbit', '3️⃣')}
  `;
}
function advanceStatus(id, next){
  const s = DB.sppd.find(x=>x.id===id); if(!s) return;
  s.status = next;
  s.approvalLog.push({by: next.includes('Atasan')?'Atasan Langsung': next.includes('PPK')?'PPK/PA':'Sistem', action:`Status → ${next}`, at:new Date().toISOString()});
  saveData(DB); renderApproval(); toast(`${s.nomor}: status diperbarui ke "${next}"`);
}
function rejectSppd(id){
  const s = DB.sppd.find(x=>x.id===id); if(!s) return;
  const alasan = prompt('Alasan penolakan:', 'Tidak sesuai prioritas anggaran / substitusi rapat daring');
  if(alasan===null) return;
  s.status='Ditolak'; s.approvalLog.push({by:'Pejabat Berwenang', action:`Ditolak: ${alasan}`, at:new Date().toISOString()});
  saveData(DB); renderApproval(); toast(`${s.nomor} ditolak`);
}

function renderDokumen(){
  const c = document.getElementById('content');
  const opts = DB.sppd.slice().sort((a,b)=>b.tanggalBerangkat.localeCompare(a.tanggalBerangkat));
  c.innerHTML = `
    <div class="toolbar">
      <select id="dokSelect" onchange="selectDokumen(this.value)" style="max-width:420px;">
        ${opts.map(s=>`<option value="${s.id}">${s.nomor} — ${pegawaiNames(s)} (${s.kotaTujuan})</option>`).join('') || '<option>Belum ada SPPD</option>'}
      </select>
      <div class="pill-tabs" id="dokTabs" style="margin:0;">
        <div class="pill active" data-tab="sppd" onclick="switchDokTab('sppd')">Surat Tugas / SPPD</div>
        <div class="pill" data-tab="rincian" onclick="switchDokTab('rincian')">Rincian Biaya</div>

  window.switchDokTab = (t)=>{ currentDokTab=t; document.querySelectorAll('#dokTabs .pill').forEach(p=>p.classList.toggle('active', p.dataset.tab===t)); renderDokBody(); };
  window.selectDokumen = (id)=>{ document.getElementById('dokSelect').value=id; renderDokBody(); };
  function renderDokBody(){
    const id = document.getElementById('dokSelect').value;
    const s = DB.sppd.find(x=>x.id===id);

      currentDokTab==='sppd' ? docSppdHtml(s) : currentDokTab==='rincian' ? docRincianHtml(s) : docKuitansiHtml(s);
    document.getElementById('dokContainer').innerHTML = `<div class="doc-sheet">${html}</div>`;

  }
  if(opts.length) renderDokBody();
}

   LPJ

function renderLpj(){
  const c = document.getElementById('content');
  const needLpj = DB.sppd.filter(s=>s.status==='Menunggu LPJ');
  const inReview = DB.lpj.filter(l=>l.status==='Menunggu Verifikasi');
  const done = DB.lpj.filter(l=>l.status==='Terverifikasi');
  c.innerHTML = `
    <div class="alert alert-warn">🕐 Batas penyampaian laporan pertanggungjawaban (LPJ): <b>${DB.settings.batasLPJHari} hari kerja</b> setelah tanggal kembali (dapat disesuaikan pada menu Master Data sesuai ketentuan internal instansi).</div>

    <div class="section-title"><h2>Perlu Diajukan LPJ</h2><span class="hint">${needLpj.length} SPPD selesai</span></div>
    <div class="table-wrap"><table>
      <thead><tr><th>Nomor SPPD</th><th>Pegawai</th><th>Kembali</th><th>Jatuh Tempo LPJ</th><th>Biaya SPPD</th><th></th></tr></thead>
      <tbody>
        ${needLpj.map(s=>{
          const overdue = daysBetween(s.tanggalKembali, todayISO()) > DB.settings.batasLPJHari;
          return `<tr>
            <td>${s.nomor}</td><td>${pegawaiNames(s)}</td><td>${fmtDate(s.tanggalKembali)}</td>
            <td>${overdue?'<span style="color:var(--danger); font-weight:700;">Lewat batas</span>':fmtDate(addBusinessDays(s.tanggalKembali, DB.settings.batasLPJHari))}</td>
            <td>${fmtRp(s.totalBiaya)}</td>
            <td><button class="btn btn-accent btn-sm" onclick="openLpjModal('${s.id}')">Isi LPJ</button></td>
          </tr>`;
        }).join('') || `<tr><td colspan="6"><div class="empty">Tidak ada tunggakan LPJ.</div></td></tr>`}
      </tbody>
    </table></div>

    <div class="section-title"><h2>Menunggu Verifikasi</h2><span class="hint">${inReview.length} laporan</span></div>
    <div class="table-wrap"><table>
      <thead><tr><th>Nomor SPPD</th><th>Tgl Lapor</th><th>Biaya SPPD</th><th>Realisasi Riil</th><th>Selisih</th><th></th></tr></thead>
      <tbody>
        ${inReview.map(l=>{
          const s = DB.sppd.find(x=>x.id===l.sppdId); if(!s) return '';
          const selisih = s.totalBiaya - l.biayaRiil;
          return `<tr>
            <td>${s.nomor}</td><td>${fmtDate(l.tanggalLapor)}</td><td>${fmtRp(s.totalBiaya)}</td><td>${fmtRp(l.biayaRiil)}</td>
            <td style="color:${selisih>=0?'var(--accent)':'var(--danger)'}">${selisih>=0?'Lebih bayar':'Kurang bayar'} ${fmtRp(Math.abs(selisih))}</td>
            <td><button class="btn btn-outline btn-sm" onclick="verifyLpj('${l.id}')">✔ Verifikasi</button></td>
          </tr>`;
        }).join('') || `<tr><td colspan="6"><div class="empty">Tidak ada laporan menunggu verifikasi.</div></td></tr>`}
      </tbody>
    </table></div>

    <div class="section-title"><h2>Riwayat LPJ Terverifikasi</h2><span class="hint">${done.length} laporan</span></div>
    <div class="table-wrap"><table>
      <thead><tr><th>Nomor SPPD</th><th>Ringkasan Hasil</th><th>Biaya Riil</th></tr></thead>
      <tbody>
        ${done.map(l=>{ const s = DB.sppd.find(x=>x.id===l.sppdId); if(!s) return ''; return `<tr><td>${s.nomor}</td><td>${l.ringkasan}</td><td>${fmtRp(l.biayaRiil)}</td></tr>`; }).join('') || `<tr><td colspan="3"><div class="empty">Belum ada riwayat.</div></td></tr>`}
      </tbody>
    </table></div>
  `;
}
function addBusinessDays(dateStr, n){
  let d = new Date(dateStr+'T00:00:00'); let added=0;
  while(added<n){ d.setDate(d.getDate()+1); if(d.getDay()!==0 && d.getDay()!==6) added++; }
  return d.toISOString().slice(0,10);
}
function openLpjModal(sppdId){
  const s = DB.sppd.find(x=>x.id===sppdId);
  document.getElementById('modalBox').className='modal';
  document.getElementById('modalBox').innerHTML = `
    <div class="modal-head"><h3>Laporan Hasil Perjalanan Dinas</h3><button class="close-x" onclick="closeModal()">✕</button></div>
    <p class="muted">${s.nomor} — ${pegawaiNames(s)} — ${s.kotaTujuan}</p>
    <label>Tanggal Pelaporan</label><input type="date" id="lpj_tgl" value="${todayISO()}">
    <div style="height:10px;"></div>
    <label>Ringkasan Hasil Pelaksanaan Tugas</label><textarea id="lpj_ringkasan" placeholder="Uraikan hasil, capaian, dan tindak lanjut dari kegiatan perjalanan dinas..."></textarea>
    <div style="height:10px;"></div>
    <label>Realisasi Biaya Riil (bukti pengeluaran)</label><input type="number" id="lpj_biaya" value="${s.totalBiaya}">
    <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:16px;">
      <button class="btn btn-outline" onclick="closeModal()">Batal</button>
      <button class="btn btn-primary" onclick="submitLpj('${s.id}')">Kirim LPJ</button>
    </div>
  `;
  document.getElementById('modalBg').classList.add('open');
}
function submitLpj(sppdId){
  const s = DB.sppd.find(x=>x.id===sppdId);
  const ringkasan = document.getElementById('lpj_ringkasan').value.trim();
  if(!ringkasan){ toast('Isi ringkasan hasil perjalanan dinas'); return; }
  DB.lpj.push({ id: uid('lpj'), sppdId, tanggalLapor: document.getElementById('lpj_tgl').value, ringkasan, biayaRiil: Number(document.getElementById('lpj_biaya').value)||s.totalBiaya, status:'Menunggu Verifikasi' });
  s.status = 'Menunggu LPJ';
  saveData(DB); closeModal(); renderLpj(); toast('LPJ berhasil dikirim, menunggu verifikasi PPK');
}
function verifyLpj(lpjId){
  const l = DB.lpj.find(x=>x.id===lpjId); if(!l) return;
  l.status='Terverifikasi';
  const s = DB.sppd.find(x=>x.id===l.sppdId); if(s) s.status='LPJ Terverifikasi';
  saveData(DB); renderLpj(); toast('LPJ terverifikasi, perjalanan dinas ditutup');
}

   ANGGARAN
========================================================= */
function renderAnggaran(){
  const c = document.getElementById('content');
  const rows = DB.unitKerja.map(u=>{
    const list = DB.sppd.filter(s=>s.unitId===u.id);
    const realisasi = list.filter(s=>['Selesai','Menunggu LPJ','LPJ Terverifikasi'].includes(s.status)).reduce((a,s)=>a+s.totalBiaya,0);
    const komitmen = list.filter(s=>['Diajukan','Disetujui Atasan','Disetujui PPK','SPPD Terbit','Sedang Berjalan'].includes(s.status)).reduce((a,s)=>a+s.totalBiaya,0);
    return {u, realisasi, komitmen, sisa: u.pagu - realisasi - komitmen};
  });
  c.innerHTML = `
    <div class="grid grid-3">
      ${statCard('💰','Total Pagu Perjadin', fmtRp(DB.unitKerja.reduce((a,u)=>a+u.pagu,0)), 'var(--brand)','var(--brand-light)')}
      ${statCard('✅','Total Realisasi', fmtRp(rows.reduce((a,r)=>a+r.realisasi,0)), 'var(--accent)','var(--accent-light)')}
      ${statCard('📌','Komitmen Berjalan', fmtRp(rows.reduce((a,r)=>a+r.komitmen,0)), 'var(--warn)','var(--warn-light)')}
    </div>
    <div class="section-title"><h2>Pagu vs Realisasi per Unit Kerja</h2><span class="hint">TA ${DB.settings.tahunAnggaran}</span></div>
    <div class="table-wrap"><table>
      <thead><tr><th>Unit Kerja</th><th>Pagu</th><th>Realisasi</th><th>Komitmen Berjalan</th><th>Sisa Pagu</th><th style="min-width:140px;">Serapan</th></tr></thead>
      <tbody>
        ${rows.map(r=>{
          const pct = (r.realisasi+r.komitmen)/r.u.pagu*100;
          return `<tr>
            <td><b>${r.u.nama}</b></td><td>${fmtRp(r.u.pagu)}</td><td>${fmtRp(r.realisasi)}</td><td>${fmtRp(r.komitmen)}</td>
            <td style="color:${r.sisa<0?'var(--danger)':'inherit'}">${fmtRp(r.sisa)}</td>
            <td><div class="progress-bar"><div class="progress-fill" style="width:${Math.min(100,pct)}%; background:${pct>95?'var(--danger)':pct>80?'var(--warn)':'var(--accent)'}"></div></div><span class="muted">${pct.toFixed(1)}%</span></td>
          </tr>`;
        }).join('')}
      </tbody>
    </table></div>
    ${rows.some(r=>r.sisa<0) ? `<div class="alert alert-danger" style="margin-top:14px;">⚠️ Terdapat unit kerja dengan proyeksi realisasi melebihi pagu. Tinjau kembali prioritas perjalanan dinas yang belum terbit SPPD.</div>` : ''}
  `;
}

/* =========================================================
   MASTER DATA
========================================================= */
let masterTab = 'pegawai';
function renderMaster(){
  const c = document.getElementById('content');
  c.innerHTML = `
    <div class="pill-tabs" id="masterTabs">
      <div class="pill ${masterTab==='pegawai'?'active':''}" onclick="switchMaster('pegawai')">Pegawai</div>
      <div class="pill ${masterTab==='unit'?'active':''}" onclick="switchMaster('unit')">Unit Kerja &amp; Pagu</div>
      <div class="pill ${masterTab==='tarif'?'active':''}" onclick="switchMaster('tarif')">Tarif SBM</div>
      <div class="pill ${masterTab==='pengaturan'?'active':''}" onclick="switchMaster('pengaturan')">Pengaturan</div>
    </div>
    <div id="masterBody"></div>
  `;
  renderMasterBody();
}
function switchMaster(t){ masterTab=t; renderMaster(); }
function renderMasterBody(){
  const el = document.getElementById('masterBody');
  if(masterTab==='pegawai'){
    el.innerHTML = `
      <div class="toolbar"><button class="btn btn-primary btn-sm" onclick="openPegawaiModal()">+ Tambah Pegawai</button></div>
      <div class="table-wrap"><table>
        <thead><tr><th>Nama</th><th>NIP</th><th>Golongan</th><th>Jabatan</th><th>Kategori Tarif</th><th>Unit Kerja</th><th></th></tr></thead>
        <tbody>${DB.pegawai.map(p=>`<tr>
          <td>${p.nama}</td><td>${p.nip}</td><td>${p.golongan}</td><td>${p.jabatan}</td><td>${p.kategori}</td><td>${p.unit}</td>
          <td><button class="icon-btn" onclick="openPegawaiModal('${p.id}')">✏️</button></td>
        </tr>`).join('')}</tbody>
      </table></div>`;
  } else if(masterTab==='unit'){
    el.innerHTML = `
      <div class="table-wrap"><table>
        <thead><tr><th>Unit Kerja</th><th>Pagu Anggaran Perjadin (TA ${DB.settings.tahunAnggaran})</th><th></th></tr></thead>
        <tbody>${DB.unitKerja.map(u=>`<tr>
          <td>${u.nama}</td>
          <td><input type="number" value="${u.pagu}" onchange="updateUnitPagu('${u.id}', this.value)"></td>
          <td class="muted">otomatis tersimpan</td>
        </tr>`).join('')}</tbody>
      </table></div>`;
  } else if(masterTab==='tarif'){
    el.innerHTML = `
      <div class="alert alert-warn">⚠️ Nilai pada tabel ini adalah <b>contoh/ilustrasi antarmuka</b> yang disusun mengacu rentang umum pada Peraturan Menteri Keuangan Nomor 32 Tahun 2025 tentang Standar Biaya Masukan Tahun Anggaran 2026. Sebelum digunakan untuk pembayaran riil, sesuaikan setiap angka dengan lampiran resmi PMK dimaksud (atau PMK SBM terbaru yang berlaku) sesuai kementerian/lembaga dan wilayah tujuan.</div>

      <h3 style="margin-bottom:6px;">Uang Harian Dalam Kota</h3>
      <div class="table-wrap tight"><table>
        <tr><td>Perjalanan dinas dalam kota &gt; 8 jam</td><td style="width:160px;"><input type="number" value="${DB.dalamKota.umum}" onchange="DB.dalamKota.umum=Number(this.value); saveData(DB);"></td></tr>
        <tr><td>Kegiatan pendidikan &amp; pelatihan (diklat) dalam kota</td><td><input type="number" value="${DB.dalamKota.diklat}" onchange="DB.dalamKota.diklat=Number(this.value); saveData(DB);"></td></tr>
      </table></div>

      <h3 style="margin:18px 0 6px;">Uang Harian Luar Kota per Zona</h3>
      <div class="table-wrap tight"><table>
        ${DB.zona.map(z=>`<tr><td>${z.nama}</td><td style="width:160px;"><input type="number" value="${z.harian}" onchange="updateZona('${z.id}', this.value)"></td></tr>`).join('')}
      </table></div>

      <h3 style="margin:18px 0 6px;">Uang Representasi per Hari</h3>
      <div class="table-wrap tight"><table>
        ${Object.keys(DB.representasi).map(k=>`<tr><td>${k}</td><td style="width:160px;"><input type="number" value="${DB.representasi[k]}" onchange="DB.representasi['${k}']=Number(this.value); saveData(DB);"></td></tr>`).join('')}
      </table></div>

      <h3 style="margin:18px 0 6px;">Biaya Penginapan per Malam (menurut kategori &amp; kelas kota)</h3>
      <div class="table-wrap"><table>
        <thead><tr><th>Kategori Pejabat/Pegawai</th><th>Kota Besar</th><th>Kota Sedang</th><th>Kota Kecil</th></tr></thead>
        <tbody>${Object.keys(DB.penginapan).map(k=>`<tr>
          <td>${k}</td>
          <td><input type="number" value="${DB.penginapan[k].tinggi}" onchange="DB.penginapan['${k}'].tinggi=Number(this.value); saveData(DB);"></td>
          <td><input type="number" value="${DB.penginapan[k].sedang}" onchange="DB.penginapan['${k}'].sedang=Number(this.value); saveData(DB);"></td>
          <td><input type="number" value="${DB.penginapan[k].rendah}" onchange="DB.penginapan['${k}'].rendah=Number(this.value); saveData(DB);"></td>
        </tr>`).join('')}</tbody>
      </table></div>

      <h3 style="margin:18px 0 6px;">Transportasi Lokal (dari/ke bandara-terminal-stasiun, sekali jalan)</h3>
      <input type="number" style="max-width:220px;" value="${DB.transportLokal}" onchange="DB.transportLokal=Number(this.value); saveData(DB);">
    `;
  } else {
    el.innerHTML = `
      <div class="card" style="max-width:520px;">
        <h3>Pengaturan Umum</h3>
        <div class="form-grid" style="margin-top:10px;">
          <div><label>Nama Instansi</label><input type="text" value="${DB.settings.namaInstansi}" onchange="DB.settings.namaInstansi=this.value; saveData(DB);"></div>
          <div><label>Kota Kedudukan</label><input type="text" value="${DB.settings.kotaInstansi}" onchange="DB.settings.kotaInstansi=this.value; saveData(DB);"></div>
          <div><label>Tahun Anggaran</label><input type="number" value="${DB.settings.tahunAnggaran}" onchange="DB.settings.tahunAnggaran=Number(this.value); saveData(DB);"></div>
          <div><label>Batas Waktu LPJ (hari kerja)</label><input type="number" value="${DB.settings.batasLPJHari}" onchange="DB.settings.batasLPJHari=Number(this.value); saveData(DB);"></div>
        </div>
      </div>`;
  }
}
function updateZona(id, val){ const z = DB.zona.find(x=>x.id===id); z.harian = Number(val); saveData(DB); }
function updateUnitPagu(id, val){ const u = DB.unitKerja.find(x=>x.id===id); u.pagu = Number(val); saveData(DB); toast('Pagu diperbarui'); }

function openPegawaiModal(id){
  const editing = id ? DB.pegawai.find(p=>p.id===id) : null;
  const p = editing || {nama:'',nip:'',golongan:'III/a',jabatan:'',kategori:'Fungsional/Staf',unit:DB.unitKerja[0].nama};
  document.getElementById('modalBox').className='modal';
  document.getElementById('modalBox').innerHTML = `
    <div class="modal-head"><h3>${editing?'Ubah':'Tambah'} Data Pegawai</h3><button class="close-x" onclick="closeModal()">✕</button></div>
    <div class="form-grid">
      <div class="full"><label>Nama Lengkap &amp; Gelar</label><input type="text" id="pg_nama" value="${p.nama}"></div>
      <div><label>NIP</label><input type="text" id="pg_nip" value="${p.nip}"></div>
      <div><label>Golongan / Ruang</label><input type="text" id="pg_gol" value="${p.golongan}"></div>
      <div><label>Jabatan</label><input type="text" id="pg_jab" value="${p.jabatan}"></div>
      <div><label>Kategori Tarif SBM</label>
        <select id="pg_kat">${Object.keys(DB.penginapan).map(k=>`<option ${k===p.kategori?'selected':''}>${k}</option>`).join('')}</select>
      </div>
      <div class="full"><label>Unit Kerja</label>
        <select id="pg_unit">${DB.unitKerja.map(u=>`<option ${u.nama===p.unit?'selected':''}>${u.nama}</option>`).join('')}</select>
      </div>
    </div>
    <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:16px;">
      <button class="btn btn-outline" onclick="closeModal()">Batal</button>
      <button class="btn btn-primary" onclick="savePegawai('${editing?editing.id:''}')">Simpan</button>
    </div>
  `;
  document.getElementById('modalBg').classList.add('open');
}
function savePegawai(id){
  const data = { nama: pg('pg_nama'), nip: pg('pg_nip'), golongan: pg('pg_gol'), jabatan: pg('pg_jab'), kategori: pg('pg_kat'), unit: pg('pg_unit') };
  if(!data.nama){ toast('Nama wajib diisi'); return; }
  if(id){ Object.assign(DB.pegawai.find(p=>p.id===id), data); }
  else { DB.pegawai.push(Object.assign({id: uid('p')}, data)); }
  saveData(DB); closeModal(); renderMasterBody(); toast('Data pegawai disimpan');
}
function pg(id){ return document.getElementById(id).value; }
